<!doctype html>
<!--
  A chrome-less borch widget, for embedding on any page by iframe.

      <iframe src=".../site/embed/embed.html?lesson=mini-transformer&cell=1"
              width="100%" height="480" style="border:0"></iframe>

  It reads a lesson id from the query, finds the lesson in `assets/curriculum.json`, pulls
  the one runnable cell out of that lesson's page, and activates it with the same
  `runnable.js` the site uses. **No page chrome, no coi.js** — a WebGPU cell runs in a
  cross-origin iframe without cross-origin isolation (measured, Phase 0). The Python twin
  needs SharedArrayBuffer, which a non-isolated foreign host cannot grant, so the embed is
  JavaScript-only: the py source is dropped before the cell is mounted.

  **Where it does not work, and why that is not a bug here.** The embed is served without
  `Cross-Origin-Resource-Policy: cross-origin`, so a host page that *is* cross-origin
  isolated (one sending `COEP: require-corp`) blocks this iframe outright. Ordinary blogs
  and docs sites are not isolated, which is the case this route is for; a host that went
  out of its way to isolate itself is the one that cannot take the widget. The header
  cannot be added from here either — GitHub Pages serves this file and attaches no
  response headers of ours. Anyone building a copy-embed surface should say this next to
  the snippet rather than let a reader find it as a blank frame.

  This directory is excluded from the full-page site guards (nav, share-metadata, sidebar)
  because an embed is deliberately chrome-less — see `_pages()` in tests/test_site.py.
  What looks at it instead is `tests/browser/embed_probe.py`, nightly: four widgets in a
  genuinely foreign iframe, and every lesson in `curriculum.json` resolved statically to
  an embeddable cell, so a lesson added tomorrow is covered without a list being edited.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>borch widget</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  html, body { margin: 0; background: var(--bg); }
  body { padding: 12px; }
  .runnable { margin: 0; }
  #err { font: 13px var(--mono, monospace); color: var(--bad, #ff6b6b); padding: 8px 0; }
  /* a quiet backlink, so an embed says where it came from without shouting */
  .credit { margin: 10px 2px 0; font: 11px var(--sans, system-ui); }
  .credit a { color: var(--fg-faint, #7b8799); text-decoration: none; }
  .credit a:hover { color: var(--ember-text, #d1500f); }
</style>
</head>
<body>
  <div id="mount"></div>
  <div id="err" hidden></div>
  <p class="credit" hidden><a id="credit-link" target="_blank" rel="noopener">▶ runs live · borch</a></p>

  <script type="module">
    const q = new URLSearchParams(location.search);
    const id = q.get("lesson");
    const cell = parseInt(q.get("cell") || "0", 10);
    const lang = q.get("lang") === "ko" ? "ko" : "en";
    const errBox = document.getElementById("err");
    const fail = (msg) => { errBox.hidden = false; errBox.textContent = msg; };

    // The parent iframe can size itself to us: we post our height on every change.
    const postHeight = () => parent.postMessage(
      { type: "borch-embed-height", height: document.documentElement.scrollHeight }, "*");

    try {
      if (!id) throw new Error("embed: no ?lesson=<id> given");
      const cur = await fetch("../assets/curriculum.json").then((r) => r.json());
      const lesson = cur.lessons.find((l) => l.id === id);
      if (!lesson) throw new Error(`embed: no lesson with id ${id}`);
      const url = "../" + (lang === "ko" ? lesson.ko_url : lesson.url);

      const html = await fetch(url).then((r) => r.text());
      const doc = new DOMParser().parseFromString(html, "text/html");
      const blocks = [...doc.querySelectorAll("div.runnable")];
      const chosen = blocks[cell];
      if (!chosen) throw new Error(`embed: lesson ${id} has no cell ${cell} (it has ${blocks.length})`);

      // Keep Python only where it can run. Pyodide's synchronous readback needs
      // SharedArrayBuffer, which exists only in a cross-origin-isolated frame — the case on
      // an isolated host (this site's own pages, a same-origin embed). On a plain foreign
      // host the twin cannot work, so it is dropped there rather than shown broken. A
      // py-only cell is left as it is either way.
      const node = document.importNode(chosen, true);
      if (!window.crossOriginIsolated
          && node.querySelector('script[type="text/plain"][data-lang="js"]')) {
        node.querySelectorAll('script[type="text/plain"][data-lang="py"]').forEach((s) => s.remove());
        node.setAttribute("data-lang", "js");
      }
      document.getElementById("mount").appendChild(node);
      document.documentElement.lang = lang;

      // An embed lands on strangers' browsers — a WebGPU-less one (mobile Safari before 26,
      // a locked-down Chrome) should meet a clean line, not the runner's stack trace on Run.
      if (!navigator.gpu) {
        const note = document.createElement("div");
        note.className = "note-box";
        note.style.margin = "0 0 12px";
        note.innerHTML = lang === "ko"
          ? "<strong>이 위젯은 WebGPU가 필요합니다.</strong> Chrome·Edge 113+, Firefox 141+, Safari 26+ 에서 돕니다 — 그 브라우저로 열면 학습이 보입니다."
          : "<strong>This widget needs WebGPU.</strong> It runs in Chrome and Edge 113+, Firefox 141+, and Safari 26+ — open it in one of those to watch it train.";
        document.getElementById("mount").prepend(note);
      }

      // The backlink points at the lesson this cell came from, on borch's own origin.
      const link = document.getElementById("credit-link");
      link.href = new URL(url, location.href).href;
      link.parentElement.hidden = false;

      // runnable.js runs mountRunnables() on load; the cell is already in the DOM.
      await import("../assets/runnable.js");

      postHeight();
      new ResizeObserver(postHeight).observe(document.documentElement);

      // `?auto=1` presses Run once on load — for the gallery, where the widgets are the
      // point and code is not. The gallery's iframes are `loading="lazy"`, so the embed
      // only loads (and so only auto-runs) once it is scrolled near the viewport: the cards
      // come alive as you reach them, not all at once. Lessons and the landing showcase
      // leave it off, so a reader meets the code first. A run needs WebGPU; without it the
      // banner above stands instead.
      if (q.get("auto") && navigator.gpu) {
        const run = document.querySelector(".runnable button.go");
        if (run) run.click();
      }
    } catch (e) {
      fail(String((e && e.message) || e));
      postHeight();
    }
  </script>
</body>
</html>
