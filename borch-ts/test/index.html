<!doctype html>
<!--
  The borch.ts golden runner.

  Serve the repository root statically and open /borch-ts/test/. For example:
      python3 -m http.server 8000
  The result goes to the screen and to the console, and stays in `window.__borchReport`
  as well — an automated runner such as Playwright reads it there.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>borch.ts — against the golden</title>
  <style>
    body { font: 14px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
           margin: 2rem; max-width: 60rem; }
    pre { white-space: pre-wrap; }
    .fail { color: #b00020; }
    .ok { color: #0a7b34; }
  </style>
</head>
<body>
  <h1>borch.ts — against the golden</h1>
  <pre id="out">running…</pre>
  <script type="module">
    // `npm run build:ts` makes dist. The emit is loaded rather than the source — a
    // browser cannot read TypeScript as it is.
    import { run, format } from "../dist/test/golden.js";
    import { why } from "./why.js";

    const out = document.getElementById("out");
    // Only a relative path. Nail in a host and it is right in one place alone, wherever
    // it is served from.
    const GOLDEN = "../../tests/golden.json";

    try {
      const report = await run(GOLDEN);
      window.__borchReport = report;
      out.textContent = format(report);
      out.className = report.failed.length === 0 && report.unknown.length === 0
        ? "ok" : "fail";
    } catch (err) {
      // A failure is not passed over quietly — what did not run and what passed are
      // different things.
      window.__borchReport = { error: why(err) };
      out.textContent = `it could not run: ${why(err)}`;
      out.className = "fail";
    }
  </script>
</body>
</html>
