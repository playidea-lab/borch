<!doctype html>
<meta charset="utf-8">
<title>장치 관리</title>
<body>
  <pre id="out">도는 중…</pre>
  <script type="module">
    import { Device } from "../dist/src/device.js";
    import { report } from "../dist/test/device.js";
    import { why } from "./why.js";

    const out = document.getElementById("out");
    try {
      const text = await report();
      window.__borchDevice = {
        text, adapter: Device.adapterInfo, features: Device.adapterFeatures,
      };
      out.textContent = text;
    } catch (err) {
      // 터지는 것도 결과다 — 조용히 넘기면 러너가 영원히 기다린다.
      window.__borchDevice = { error: String(why(err)) };
      out.textContent = `장치 점검이 터졌다: ${why(err)}`;
    }
  </script>
</body>
