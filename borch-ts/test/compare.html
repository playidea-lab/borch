<!doctype html>
<!--
  The comparison bench: borch.ts's ResNet-18 (CIFAR) training step and the same step in
  TF.js, on this page, on this GPU, one after the other.

      npm run build:ts
      uv run --with playwright python borch-ts/test/compare.py [--headed]

  The result stays on the screen and in `window.__borchCompare`.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>borch.ts vs TF.js vs ONNX Runtime Web — ResNet-18 (CIFAR), ViT-Tiny/16</title>
  <!-- bimm-ts owns the ViT; it imports the same borch-ts emit this page does (one module instance). -->
  <script type="importmap">
  { "imports": { "borch-ts": "/borch-ts/dist/src/index.js", "bimm-ts": "/node_modules/bimm-ts/dist/src/index.js" } }
  </script>
  <style>
    body { font: 14px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
           margin: 2rem; max-width: 60rem; }
    pre { white-space: pre-wrap; }
  </style>
  <!-- Pinned bytes, not a CDN: tests/browser/assets.lock holds their hashes. -->
  <script src="../../vendor/tf.min.js"></script>
  <script src="../../vendor/tf-backend-webgpu.min.js"></script>
  <script src="../../vendor/ort.webgpu.min.js"></script>
</head>
<body>
  <h1>borch.ts vs TF.js — a ResNet-18 (CIFAR) training step</h1>
  <pre id="out">measuring… (this takes a while)</pre>
  <script type="module">
    import { init } from "../dist/src/tensor.js";
    import { Device } from "../dist/src/device.js";
    import { report } from "../dist/test/bench.js";
    import { reportTf, reportInfer, reportInferVit } from "../dist/test/compare.js";
    import { why } from "./why.js";

    const out = document.getElementById("out");
    try {
      await init();
      // The adapter before anything is timed — the runner refuses a software rasteriser
      // here rather than after the minutes its numbers take (see compare_peers.html).
      window.__borchAdapter = Device.adapterInfo;
      // `?only=infer` skips the two training halves — the inference half alone is what
      // a kernel change is measured against, and the training halves take minutes.
      // `?only=vit` is the transformer half alone (a kernel change to attention's
      // matmuls is measured against it, and the ResNet half takes minutes too).
      const only = new URLSearchParams(location.search).get("only");
      const onlyInfer = only === "infer" || only === "vit";
      let text = "";
      if (!onlyInfer) {
        const ours = await report();
        out.textContent = "borch.ts\n" + ours + "\n\nTF.js: measuring…";
        const theirs = await reportTf();
        text = "borch.ts\n" + ours + "\n\nTF.js\n" + theirs + "\n\n";
        out.textContent = text + "inference: measuring…";
      }
      if (only !== "vit") {
        const infer = await reportInfer();
        text += "inference — borch.ts vs ONNX Runtime Web (WebGPU)\n" + infer + "\n\n";
        out.textContent = text + "ViT-Tiny/16: measuring…";
      }
      const bimm = await import("bimm-ts");
      const vit = await reportInferVit(bimm);
      text += "transformer inference — ViT-Tiny/16, borch.ts (bimm-ts) vs ONNX Runtime Web (WebGPU)\n" + vit;
      window.__borchCompare = { text, adapter: Device.adapterInfo };
      out.textContent = text;
    } catch (err) {
      window.__borchCompare = { error: String(why(err)) };
      out.textContent = `it could not be measured: ${why(err)}`;
    }
  </script>
</body>
</html>
