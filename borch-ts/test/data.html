<!doctype html>
<meta charset="utf-8">
<title>데이터 적재</title>
<body>
  <pre id="out">도는 중…</pre>
  <script type="module">
    import { Device } from "../dist/src/device.js";
    import { report } from "../dist/test/data.js";
    import { why } from "./why.js";

    const out = document.getElementById("out");
    try {
      const { text, checks } = await report();
      // 러너가 numpy 로 직접 뜯어 본다 — 남이 읽는가가 이 형식을 고른 이유다.
      window.__borchData = { text, checks, adapter: Device.adapterInfo };
      out.textContent = text;
    } catch (err) {
      // 터지는 것도 결과다 — 조용히 넘기면 러너가 영원히 기다린다.
      window.__borchData = { error: String(why(err)) };
      out.textContent = `데이터 적재 점검이 터졌다: ${why(err)}`;
    }
  </script>
</body>
