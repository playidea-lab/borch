<!doctype html>
<!--
  borch.ts CIFAR-10 정확도. `tests/browser/bench.py` 의 `report_accuracy` 와 같은 잣대다.

      npm run build:ts
      uv run --with playwright python borch-ts/test/accuracy.py --headed

  **창을 띄워야 한다.** 헤드리스 크로미움은 소프트웨어 어댑터를 주고, 그러면 이 측정이
  몇 시간이 된다 — 페이지가 어댑터 이름을 먼저 찍으므로 그것을 보고 판단하라.
-->
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>borch.ts — CIFAR-10 정확도</title>
  <style>
    body { font: 14px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
           margin: 2rem; max-width: 60rem; }
    pre { white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>borch.ts — CIFAR-10 정확도</h1>
  <pre id="out">데이터를 받는 중…</pre>
  <script type="module">
    import { init } from "../dist/src/tensor.js";
    import { decodeCifar, report } from "../dist/test/accuracy.js";

    const out = document.getElementById("out");
    const params = new URLSearchParams(location.search);
    const epochs = Number(params.get("epochs") ?? 10);
    const cap = Number(params.get("images") ?? 0);
    const only = params.get("augment");

    /** 404 에 안 던지는 fetch 를 그대로 쓰면 HTML 을 데이터로 읽는다. */
    const grab = async (url) => {
      const res = await fetch(url);
      if (!res.ok) throw new Error(`받지 못했다: ${res.status} ${url}`);
      return new Uint8Array(await res.arrayBuffer());
    };

    try {
      await init();
      out.textContent = "데이터를 푸는 중…";
      // 시험 데이터는 **학습에 안 쓴 것**이어야 한다. 원본 아카이브의 test_batch 를
      // 따로 쓴다 — 같은 덩이를 나눠 쓰면 재는 것이 정확도가 아니다.
      const train = decodeCifar(await grab("/cifar-batch1.bin"));
      const test = decodeCifar(await grab("/cifar-batch-test.bin"));
      const cut = (s) => cap
        ? { x: s.x.subarray(0, cap * 3 * 32 * 32), y: s.y.subarray(0, cap), n: cap }
        : s;
      out.textContent = "학습 중… (에폭마다 줄이 늘어난다)";
      const text = await report(
        cut(train), cut(test), epochs,
        only === null ? undefined : only === "on",
      );
      window.__borchAccuracy = { text };
      out.textContent = text;
    } catch (err) {
      window.__borchAccuracy = { error: String(err && err.stack ? err.stack : err) };
      out.textContent = `재지 못했다: ${err && err.stack ? err.stack : err}`;
    }
  </script>
</body>
</html>
