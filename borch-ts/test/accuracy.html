<!doctype html>
<!--
  borch.ts's CIFAR-10 accuracy. The same yardstick as `report_accuracy` in
  `tests/browser/bench.py`.

      npm run build:ts
      uv run --with playwright python borch-ts/test/accuracy.py --headed

  **It has to be run with a window.** Headless Chromium hands over a software adapter,
  and then this measurement takes hours — the page prints the adapter's name first, so
  judge by that.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>borch.ts — CIFAR-10 accuracy</title>
  <style>
    body { font: 14px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
           margin: 2rem; max-width: 60rem; }
    pre { white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>borch.ts — CIFAR-10 accuracy</h1>
  <pre id="out">downloading the data…</pre>
  <script type="module">
    import { init } from "../dist/src/tensor.js";
    import { Device } from "../dist/src/device.js";
    import { decodeCifar, report } from "../dist/test/accuracy.js";
    import { why } from "./why.js";

    const out = document.getElementById("out");
    const params = new URLSearchParams(location.search);
    const epochs = Number(params.get("epochs") ?? 10);
    const cap = Number(params.get("images") ?? 0);
    const only = params.get("augment");

    /** Use fetch as it is, throwing nothing on a 404, and HTML gets read as data. */
    const grab = async (url) => {
      const res = await fetch(url);
      if (!res.ok) throw new Error(`could not fetch: ${res.status} ${url}`);
      return new Uint8Array(await res.arrayBuffer());
    };

    try {
      await init();
      out.textContent = "unpacking the data…";
      // The test data has to be **what the training never saw.** The original
      // archive's test_batch is used separately — split one blob and what is measured
      // is not the accuracy.
      const train = decodeCifar(await grab("/cifar-batch1.bin"));
      const test = decodeCifar(await grab("/cifar-batch-test.bin"));
      const cut = (s) => cap
        ? { x: s.x.subarray(0, cap * 3 * 32 * 32), y: s.y.subarray(0, cap), n: cap }
        : s;
      out.textContent = "training… (a line appears per epoch)";
      const text = await report(
        cut(train), cut(test), epochs,
        only === null ? undefined : only === "on",
      );
      // Left in the body alone, the runner cannot see the adapter — digging it out of
      // prose a person reads is a join that comes apart.
      window.__borchAccuracy = { text, adapter: Device.adapterInfo };
      out.textContent = text;
    } catch (err) {
      window.__borchAccuracy = { error: String(why(err)) };
      out.textContent = `it could not be measured: ${why(err)}`;
    }
  </script>
</body>
</html>
