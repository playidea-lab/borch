<!doctype html>
<meta charset="utf-8">
<title>README 예시</title>
<body>
  <pre id="out">도는 중…</pre>
  <script type="module">
    import { Device } from "../dist/src/device.js";
    import { report } from "../dist/test/readme.js";
    import { why } from "./why.js";

    const out = document.getElementById("out");
    try {
      const text = await report();
      window.__borchReadme = { text, adapter: Device.adapterInfo };
      out.textContent = text;
    } catch (err) {
      // **예시가 터지는 것이 이 페이지가 잡으려는 것이다.** 조용히 넘기면 의미가 없다.
      window.__borchReadme = { error: String(why(err)) };
      out.textContent = `예시가 터졌다: ${why(err)}`;
    }
  </script>
</body>
