<!doctype html>
<meta charset="utf-8">
<title>README examples</title>
<body>
  <pre id="out">running…</pre>
  <script type="module">
    import { Device } from "../dist/src/device.js";
    import { report } from "../dist/test/readme.js";
    import { why } from "./why.js";

    const out = document.getElementById("out");
    try {
      const { text, checks } = await report();
      window.__borchReadme = { text, checks, adapter: Device.adapterInfo };
      out.textContent = text;
    } catch (err) {
      // **An example blowing up is what this page exists to catch.** Passed over
      // quietly it means nothing.
      window.__borchReadme = { error: String(why(err)) };
      out.textContent = `an example blew up: ${why(err)}`;
    }
  </script>
</body>
