<!doctype html>
<meta charset="utf-8">
<title>체크포인트</title>
<body>
  <pre id="out">도는 중…</pre>
  <script type="module">
    import { Device } from "../dist/src/device.js";
    import { report, sample } from "../dist/test/serialize.js";

    const out = document.getElementById("out");
    try {
      const text = await report();
      // 러너가 numpy 로 직접 뜯어 본다 — 남이 읽는가가 이 형식을 고른 이유다.
      window.__borchSerialize = { text, adapter: Device.adapterInfo, sample: await sample() };
      out.textContent = text;
    } catch (err) {
      // 터지는 것도 결과다 — 조용히 넘기면 러너가 영원히 기다린다.
      window.__borchSerialize = { error: String(err && err.stack ? err.stack : err) };
      out.textContent = `체크포인트 점검이 터졌다: ${err && err.stack ? err.stack : err}`;
    }
  </script>
</body>
