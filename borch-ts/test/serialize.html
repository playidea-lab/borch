<!doctype html>
<meta charset="utf-8">
<title>checkpoints</title>
<body>
  <pre id="out">running…</pre>
  <script type="module">
    import { Device } from "../dist/src/device.js";
    import { report, sample, sampleNested } from "../dist/test/serialize.js";
    import { why } from "./why.js";

    const out = document.getElementById("out");
    try {
      const { text, checks } = await report();
      // The runner takes it apart with numpy directly — whether somebody else can read
      // it is why this format was chosen.
      window.__borchSerialize = {
        text, checks, adapter: Device.adapterInfo,
        sample: await sample(), nested: await sampleNested(),
      };
      out.textContent = text;
    } catch (err) {
      // Blowing up is a result too — pass it over quietly and the runner waits forever.
      window.__borchSerialize = { error: String(why(err)) };
      out.textContent = `the checkpoint check blew up: ${why(err)}`;
    }
  </script>
</body>
