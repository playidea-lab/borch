<!doctype html>
<!--
  Counts what one step **costs** — dispatches and buffers rather than time.

      npm run build:ts
      npm run cost:ts

  Unlike the bench (`bench.html`), **the answer means something on a software adapter
  too.** What is counted here is decided by the code path and not changed by the device.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>borch.ts — the cost of a step</title>
  <style>
    body { font: 14px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
           margin: 2rem; max-width: 60rem; }
    pre { white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>borch.ts — what one step spends, and how much of it</h1>
  <pre id="out">measuring…</pre>
  <script type="module">
    import { init } from "../dist/src/tensor.js";
    import { report } from "../dist/test/cost.js";
    import { why } from "./why.js";

    const out = document.getElementById("out");
    try {
      await init();
      const { text, checks } = await report();
      // Whether it passed is the state of the checks. This used to scan a sentence,
      // and the word the runner scanned for and the word scanned for here were not the
      // same — one report, read two different ways in two places.
      window.__borchCost = { text, checks, ok: checks.every((c) => c.ok) };
      out.textContent = text;
    } catch (err) {
      // What did not run and what passed are different — it is not passed over
      // quietly.
      window.__borchCost = { error: String(why(err)) };
      out.textContent = `it could not be measured: ${why(err)}`;
    }
  </script>
</body>
</html>
