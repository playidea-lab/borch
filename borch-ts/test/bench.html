<!doctype html>
<!--
  The borch.ts training-step bench. The same yardstick as `tests/browser/bench.py`.

      npm run build:ts
      uv run --with playwright python borch-ts/test/bench.py

  The result stays on the screen and in `window.__borchBench`.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>borch.ts — training-step bench</title>
  <style>
    body { font: 14px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
           margin: 2rem; max-width: 60rem; }
    pre { white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>borch.ts — a ResNet-18 (CIFAR) training step</h1>
  <pre id="out">measuring… (this takes a while)</pre>
  <script type="module">
    import { init } from "../dist/src/tensor.js";
    import { Device } from "../dist/src/device.js";
    import { report } from "../dist/test/bench.js";
    import { why } from "./why.js";

    const out = document.getElementById("out");
    try {
      await init();
      const text = await report();
      // **The adapter must not be left in the body alone.** The runner has to see it
      // to refuse a figure measured on a CPU, and digging it out of prose a person
      // reads is a join that comes apart.
      window.__borchBench = { text, adapter: Device.adapterInfo };
      out.textContent = text;
    } catch (err) {
      // A failure is not passed over quietly — what did not run and what is slow are
      // different things.
      window.__borchBench = { error: String(why(err)) };
      out.textContent = `it could not be measured: ${why(err)}`;
    }
  </script>
</body>
</html>
