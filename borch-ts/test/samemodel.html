<!doctype html>
<!--
  Dumps the material for asking whether borch.ts's ResNet-18 is **the same model** as
  the Python side's.

      npm run build:ts
      uv run --with playwright --with numpy --with torch python borch-ts/test/samemodel.py --headed

  It hands out the parameters, the input, the output, the loss and the input gradient,
  and the Python side computes the same things in real torch and lines them up.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>borch.ts — is it the same model</title>
  <style>
    body { font: 14px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; margin: 2rem; }
  </style>
</head>
<body>
  <h1>borch.ts — dumping the ResNet-18 material</h1>
  <pre id="out">dumping…</pre>
  <script type="module">
    import { init } from "../dist/src/tensor.js";
    import { dumpForComparison, dumpPieces } from "../dist/test/bench.js";
    import { Device } from "../dist/src/device.js";
    import { why } from "./why.js";

    const out = document.getElementById("out");
    try {
      await init();
      // The pieces are dumped first — they point at where, when the whole parts.
      const pieces = await dumpPieces();
      const dump = await dumpForComparison(2);
      window.__borchModel = { adapter: Device.adapterInfo, pieces, ...dump };
      out.textContent = `${dump.shapes.length} parameters, loss ${dump.loss}`;
    } catch (err) {
      window.__borchModel = { error: String(why(err)) };
      out.textContent = `nothing could be dumped: ${why(err)}`;
    }
  </script>
</body>
</html>
