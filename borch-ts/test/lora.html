<!doctype html>
<meta charset="utf-8">
<title>lora</title>
<body>
  <pre id="out">running…</pre>
  <script type="module">
    import { init } from "../dist/src/tensor.js";
    import { Device } from "../dist/src/device.js";
    import { report } from "../dist/test/lora.js";
    import { why } from "./why.js";
    const out = document.getElementById("out");
    try {
      await init();
      const { text, checks } = await report();
      window.__borchLora = { text, checks, adapter: Device.adapterInfo };
      out.textContent = text;
    } catch (err) {
      window.__borchLora = { error: String(why(err)) };
      out.textContent = `the LoRA check blew up: ${why(err)}`;
    }
  </script>
</body>
