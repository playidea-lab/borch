<!doctype html>
<meta charset="utf-8">
<title>torch 배선</title>
<body>
  <pre id="out">도는 중…</pre>
  <script type="module">
    import { Device } from "../dist/src/device.js";
    import { report } from "../dist/test/parity.js";
    import { why } from "./why.js";

    const out = document.getElementById("out");
    try {
      const { text, checks } = await report();
      window.__borchParity = { text, checks, adapter: Device.adapterInfo };
      out.textContent = text;
    } catch (err) {
      // 터지는 것도 결과다 — 조용히 넘기면 러너가 영원히 기다린다.
      window.__borchParity = { error: String(why(err)) };
      out.textContent = `배선 점검이 터졌다: ${why(err)}`;
    }
  </script>
</body>
