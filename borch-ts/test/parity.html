<!doctype html>
<meta charset="utf-8">
<title>torch wiring</title>
<body>
  <pre id="out">running…</pre>
  <script type="module">
    import { Device } from "../dist/src/device.js";
    import { report } from "../dist/test/parity.js";
    import { why } from "./why.js";

    const out = document.getElementById("out");
    try {
      const { text, checks } = await report();
      window.__borchParity = { text, checks, adapter: Device.adapterInfo };
      out.textContent = text;
    } catch (err) {
      // Blowing up is a result too — pass it over quietly and the runner waits forever.
      window.__borchParity = { error: String(why(err)) };
      out.textContent = `the wiring check blew up: ${why(err)}`;
    }
  </script>
</body>
