name: compared against real torch

on: [push, pull_request]

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # **The site check only bites once the declaration files exist.** `borch-ts/dist`
      # is in `.gitignore`, so it is not in the checkout, and without it
      # `tests/test_site.py` passes by skipping — it looks like a pass and it looked at
      # nothing. That state actually went up once.
      #
      # Only two things are taken, typescript and @webgpu/types (runtime dependencies
      # are still zero), so this step is cheap for what it bites.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build:ts
      # **torchvision has to be here.** pytest freezes the golden on the spot (the npz
      # is not committed — extracting it again with real torch is the point), and 14
      # vision cases call real torchvision. Matching our transforms against our own
      # expected values would prove nothing, which is what those cases are worth.
      # Without it, dump counts those 14 as failures and stops, and this job was red on
      # every push from the moment transforms arrived.
      #
      # **And `scipy` has to be here for the same kind of reason, one step further in.**
      # `tests/test_svhn.py` checks a hand-written `.mat` reader — a hundred lines of
      # `struct` and `zlib` — against `scipy.io`, which is the authority it exists so as
      # not to depend on. Without scipy the file `importorskip`s and **all nineteen of
      # its checks vanish into a single `s`**, which is what happened: the reader had
      # never been run here at all. It is a test dependency and never a library one.
      - name: compare the values
        run: uv run --with pytest --with numpy --with torch --with torchvision --with scipy --quiet pytest tests/ -q

      # ── the browser half, on a runner with no GPU ────────────────────────────
      #
      # **`pytest tests/` never opens a browser**, so until this step existed one of the
      # three implementations had no automatic check of any kind. It is how 119 golden
      # cases went red on `main` without anything saying so: they were found by a person
      # running the runner by hand, a day later.
      #
      # ## Why this can live here when `gpu.yml` cannot
      #
      # `gpu.yml` is `workflow_dispatch` for a reason that has not changed and must not:
      # a self-hosted runner on `push` turns write access to this repository into
      # execution rights on a lab machine. That file's own comment says so.
      #
      # **But this is not the GPU check.** A GitHub runner has no GPU, so Chromium hands
      # back SwiftShader — and the golden measures **values**, which are the same on any
      # adapter. Measured before this step was written: headless on a machine whose real
      # GPU was available, forced to no window, the runner reported
      # `passed 3192 / failed 0  [google / swiftshader]` and printed its own caveat that
      # the GPU path is unproved. That caveat is the whole distinction — `bench.py`
      # refuses a software adapter because a **time** is a fact about a device, and this
      # runner only warns because a **value** is not.
      #
      # So this catches every wrong number and no wrong second, which is exactly the
      # half that can be automated safely.
      #
      # ## And the binding's golden, which is the day this said it would go in
      #
      # The line here said `tests/browser/run.py --lib borch_webgpu` was red — work in
      # progress on another branch — and that it goes in beside the borch.ts one **the
      # day it passes**. It passes: 3719 of 3719.
      #
      # It is the third implementation and the only one nothing was watching. Every gap
      # closed on that branch was found by running this by hand, and one of them —
      # `matmul` still renamed to `mm` after borch.ts grew a batching one — arrived from
      # `main` **the same day this step was added**, which is the argument for the step
      # rather than for the branch.
      #
      # Pyodide is vendored (`vendor/pyodide/`), so this needs no network beyond the
      # browser download above.
      #
      # **`--lib` has no default and that is deliberate.** Leaving it off runs the numpy
      # core inside a browser, which is almost always green and is not the layer this
      # step exists for. The runner stops rather than measuring the wrong one.
      - name: fetch a browser
        run: uv run --with playwright playwright install --with-deps chromium
      - name: compare the values in a browser
        env:
          BORCH_HEADLESS: "1"
        run: uv run --with playwright python borch-ts/test/run.py
      - name: compare the values through the binding
        env:
          BORCH_HEADLESS: "1"
        run: uv run --with playwright python tests/browser/run.py --lib borch_webgpu
