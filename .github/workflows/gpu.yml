# GPU path verification — runs on a **self-hosted runner**.
#
# GitHub-hosted runners have no GPU. WebGPU falls back to SwiftShader, a software path
# no real user takes, so passing there proves nothing. Which is why a machine with a
# real GPU is registered as a runner.
#
# **The window has to be shown (`--headed`).** This is measured — headless Chromium
# either has no `navigator.gpu` or hands back a software adapter. The runner checks the
# adapter and writes it down, so a quietly wrong result is not on the table, but the
# job only passes when the runner runs as a user process with a display session.
#
# The existing `test.yml` (native pytest) is left alone. The core borch is numpy alone,
# so it never needed a browser — this workflow attaches to the GPU path only.
#
# ## Why it does not run automatically — the `push` trigger was removed
#
# **The decision was not to attach a self-hosted runner.** Registering a runner means
# that machine takes whatever this file says on every push and runs it — whatever it
# says. Then anybody who can push to this repository can run arbitrary code on that lab
# machine, and write access to `.github/workflows` becomes execution rights on it. That
# machine also runs other people's work.
#
# So this file is **a procedure written down** rather than an automatic check. While it
# was on `push`, nine runs with nowhere to run queued up and made something that was not
# running look like it was "pending" — a false signal, no better than a false green.
#
# ## Then how is the GPU path checked
#
# A person calls it. Typed directly on the development machine (the commands below are
# all of it), or sent to a GPU server when there is one — it was actually put on a cq
# worker and run on an RTX 4090 over 845 golden cases × two implementations, and the
# values matched Apple Metal. That route uses an already authenticated channel, so it
# opens no execution rights on the repository.
#
# When there is a reason to attach a runner, this trigger comes back. Attaching it is
# a person's job.

name: gpu

on:
  workflow_dispatch:

jobs:
  golden-in-browser:
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      # The only step that needs real torch. The expected values are frozen here.
      #
      # **torchvision has to be here.** 14 vision cases call real torchvision (which is
      # what those cases are worth — matching our transforms against our own expected
      # values proves nothing), and without it dump counts those 14 as failures and stops.
      - name: freeze the golden
        run: uv run --with numpy --with torch --with torchvision python tests/golden.py dump

      # borch.ts reads the golden as JSON. It is exported again here so it cannot
      # diverge from the npz.
      - name: export the golden as JSON
        run: uv run --with numpy python tests/export_json.py

      # Fetches Pyodide and locks it by hash. Already present, it only compares.
      # (It was a dependency on a CDN being alive at test time, and it did break once.)
      - name: prepare the outside assets
        run: uv run python tests/browser/vendor.py check

      - name: prepare the browser
        run: uv run --with playwright playwright install chromium

      # Both the core and the GPU path are looked at. They use the same golden, so a
      # divergence says immediately which side it is on.
      - name: compare the core against the golden
        run: uv run --with playwright python tests/browser/run.py --lib borch --headed

      - name: compare the GPU path against the golden
        run: uv run --with playwright python tests/browser/run.py --lib borch_webgpu --headed

      # borch.ts — the very layer the Python binding above sits on. It asks the same
      # golden again in its own language. The browser cannot read TS, so it is emitted
      # as JS first.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: install borch.ts's toolchain
        run: npm ci

      - name: build borch.ts
        run: npm run build:ts

      - name: compare borch.ts against the golden
        run: uv run --with playwright python borch-ts/test/run.py --headed
