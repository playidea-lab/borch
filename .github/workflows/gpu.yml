# GPU path verification — runs on a **self-hosted runner**.
#
# GitHub-hosted runners have no GPU. WebGPU falls back to SwiftShader, a software path
# no real user takes, so passing there proves nothing. Which is why a machine with a
# real GPU is registered as a runner.
#
# **The window has to be shown (`--headed`).** This is measured — headless Chromium
# either has no `navigator.gpu` or hands back a software adapter. The runner checks the
# adapter and writes it down, so a quietly wrong result is not on the table, but the
# job only passes when the runner runs as a user process with a display session.
#
# The existing `test.yml` (native pytest) is left alone. The core borch is numpy alone,
# so it never needed a browser — this workflow attaches to the GPU path only.
#
# ## Why it does not run automatically — the `push` trigger was removed
#
# **The decision was not to attach a self-hosted runner.** Registering a runner means
# that machine takes whatever this file says on every push and runs it — whatever it
# says. Then anybody who can push to this repository can run arbitrary code on that lab
# machine, and write access to `.github/workflows` becomes execution rights on it. That
# machine also runs other people's work.
#
# So this file is **a procedure written down** rather than an automatic check. While it
# was on `push`, nine runs with nowhere to run queued up and made something that was not
# running look like it was "pending" — a false signal, no better than a false green.
#
# ## Then how is the GPU path checked
#
# A person calls it. Typed directly on the development machine, or sent to a GPU server
# when there is one — it was actually put on a cq worker, which uses an already
# authenticated channel and so opens no execution rights on the repository.
#
# **That run did not check the GPU path, and this paragraph said it did.** It read "run
# on an RTX 4090 over 845 golden cases × two implementations, and the values matched
# Apple Metal" until today. `tests/browser/launch.py` has recorded since 2026-08-15
# what that run actually was:
#
#     Running the golden cases headless on a Linux GPU server gave 845/845 while the
#     adapter was `google / swiftshader` — the pass was real and the claim "confirmed
#     on another vendor" was false.
#
# There was a 4090 in the machine and the browser never reached it. Headless hands back
# Chrome's software rasteriser, which answers every WebGPU call correctly, so the values
# proved the logic and nothing about a GPU.
#
# **This sentence is where that claim was manufactured.** It travelled from here into
# the README and, six days later, through a translation commit into the landing page in
# both languages — every copy carrying the number and dropping the adapter. Two sessions
# corrected the landing page today and the second correction re-asserted it, because the
# number is checkable and the missing word is not visible.
#
# So the number stays here with what it was. Deleting it would leave the next person to
# find 845 somewhere else and write this paragraph again — which is what happened today.
#
# `tests/test_vendor_claims.py` compares the live documents against `launch.py`. This
# file is not among them: it is a workflow rather than something a reader meets, and
# putting it in the list would have the check police the comment that explains the
# check. The guard here is the paragraph, and its retirement condition was a real run.
#
# ## The real run happened
#
#     passed 2901 / failed 0   [nvidia / blackwell]
#
# An RTX 5080 on Ubuntu 24.04, driver 580.159.04, with a window on Xvfb. That is
# borch.ts's written share of the table at the time of the run — not the whole of it,
# and the whole has grown since.
#
# Three walls stood in front of it and the last was Chrome. With a window and every
# permission in place, `requestAdapter()` still returned null while `vulkaninfo` on that
# same machine listed the card as GPU0 with Vulkan 1.4.312 — **two tools, one machine,
# two answers.** `vulkaninfo` asks the driver; Chrome asks its own blocklist first, and
# Linux with the proprietary driver is on it. The runner's own error message guessed
# *"a driver blocklist"* from the beginning and nobody took it literally.
#
# `--ignore-gpu-blocklist` and `--disable-gpu-driver-bug-workarounds` went in together
# and the pair has since been separated: **the first alone finds the adapter.** The
# 2901 was run with both, so the flag the repository carries and the number the
# documents quote are not yet a matched pair — which is exactly the shape this comment
# exists to record, at a smaller scale.
#
# So the paragraph above is history now rather than a live warning, and it stays for the
# reason it always did: 845 is still findable, and the next person who finds it needs
# the adapter beside it.
#
# When there is a reason to attach a runner, this trigger comes back. Attaching it is
# a person's job.
#
# ## What this file does **not** run — counted, because it used to say it did
#
# The line above read "the commands below are all of it". They are all of the *golden
# comparison*. There are **thirty-five entry points that need a browser** and this file
# names four:
#
#     here          run.py --lib borch · run.py --lib borch_webgpu ·
#                   borch-ts/test/run.py · vendor.py check
#
#     not here      parity:ts · data:ts · device:ts · serialize:ts · example:ts ·
#                   lessons:ts · scope:py · firstrun:site · onnx:ts · onnx:binding ·
#                   learner:site · wheel:py · lab:py · marimo:py · folder:py · hub:py · offline:py · trajectory:py ·
#                   cpu:ts · cpu:py · review:py · coi:site · seg:py · capture:py · fuse:py   (twenty-five more correctness checks)
#                   cost:ts · bench:ts · compare:ts · envelope:py · envelope2:py · profile:py  (measurements, not checks)
#
#     `cpu:ts` arrived 2026-09-05: the CPU device against the WebGPU device on two hub
#     checkpoints. It needs a browser for the GPU half only; the CPU half would run in node.
#     `cpu:py` the same day: `borch_cpu` on the wheel in a Pyodide worker, no device brought up,
#     compared with `borch_webgpu` where an adapter answers.
#     `coi:site` arrived 2026-09-05 with the worker pool: every page of the site, cross-origin
#     isolated both by headers and by the service-worker shim, with nothing blocked by COEP.
#     `seg:py` the same day: a U-Net on Kvasir-SEG through the wheel, a fifth of the masks
#     corrupted — held-out IoU against torch's, and the mask review queue's AUROC.
#     `profile:py` 2026-09-07: a training step under the device's GPU timestamps, the time per
#     kind of kernel — the instrument behind two days of kernel work; a measurement, not a check.
#     `capture:py` the same day: a step recorded under `torch.capture()` and replayed eleven times
#     against the eager run — every loss and parameter the same, bit for bit.
#     `fuse:py` the same day: the capture's elementwise trees fused into single kernels on a
#     hand-written GELU/LayerNorm network — the eager run to a rounding, in fewer kernels.
#
# **Nothing runs any of the thirty-five automatically** — the reason above is a good one
# and it applies to all of them equally, so the twenty-nine below are in exactly the position
# the four above are: run when a person runs them.
#
# The cost of that is not hypothetical. Three commits shipped in one session with the
# binding behind — `nn.BCELoss` absent, `nonzero(as_tuple)` refused, `linalg.svd` and
# `torch.svd` **each returning the other's answer** — because `pytest` and the borch.ts
# golden were both green and two greens read as three. The core suite cannot see any of
# this: `borch_webgpu` will not import outside Pyodide.
#
# **The nine were then run by hand, and two of them were red.** Neither was a
# regression; both were checks that had outlived what they watched.
#
#   · `parity:ts` — six failures. `weight` and `posWeight` on the BCE pair, a class
#     weight on `crossEntropy`, `dilation` on `MaxPool1d`, `bidirectional` and
#     `projSize` on `RNNBase` were all **declined once and implemented since**, and the
#     checks still demanded a throw. A check that watches for a refusal expires the day
#     somebody does the work. `MaxPool1d`'s had already moved once for that exact
#     reason with the lesson written beside it, so this is the second time in one file
#     and it is now asked by arrival instead, which does not expire.
#   · `scope:py` — twelve checks green and exit 1, because the runner matched the head
#     line of the report and the report had been translated. The comment on that line
#     had predicted it. The verdict crosses as a boolean now.
#
# So the failure mode this census guards against is not only *a check nobody runs goes
# stale* but *nobody finds out for however long*. `tests/test_browser_entry_points.py`
# holds the number below against the tree — it cannot run any of these, but a
# sixteenth cannot arrive unnamed.
#
# **And since 2026-09-02 something does run them.** `tests/browser/nightly.py` runs the
# fourteen correctness checks (`bench` and `compare` are measurements and stay out) in a worktree of
# `origin/main` at 04:30 on the machine that owns this checkout, via
# `~/Library/LaunchAgents/co.pilab.borch-nightly.plist`, and writes a log per run under
# `~/Library/Logs/borch-nightly/`. `firstrun:site` is the newest of them: the PRD's own
# first number, time to first run on the landing page, measured on a real adapter every
# night instead of once by whoever pressed the button. That is one machine and one person's laptop, which is
# exactly the position the paragraph above describes — but it is a log line every
# morning instead of a red file nobody opened. The list below is still the census; the
# nightly is what reads it.
#
# **The list is here rather than a script.** Making it automatic means making it slower
# to run, and slower means run less often — which is the road the miss above walked.
# What a reader needs is not a longer command but the number, so that leaving one out
# is a decision instead of an oversight.
#
# ## A number is from a tree, and the tree has to be named
#
# The first version of this note filled the `lessons:ts` row with a result somebody
# else had measured — 12 of 12 pages — and called the row covered. **That run was on a
# tree without the change it was supposed to clear.** It came from a branch that edits
# no TypeScript, and what could break a lesson page is exactly TypeScript: `nn.ts` and
# `tensor.ts` are where `Recurrent → RNNBase`, `viewAs → stridedView` and a rename of
# 240 parameters live, and every lesson calls into both.
#
# So the row did not say "checked"; it said **"checked somewhere else"**, which is the
# same sentence with the tree left out — and leaving the tree out is what made it read
# as the first one. The peer who owned that number is the one who noticed, and re-ran
# it merged: 12 of 12, 533s, values identical step for step across the 1320 lines.
#
# On **this** tree `lessons:ts` covers 12 pages and passes **12/12 over 38 JS blocks
# in 554s**. It read 8/8 over 26 blocks until that branch merged, which is what a
# number with its tree named is supposed to do: go stale visibly rather than quietly
# become a claim about a tree it was never measured on.
#
# Measured here rather than taken from the merge. The peer's run of the same command
# on the merged tree gave 533s — close, and close is not the same as counted, which
# is the whole reason the tree gets named.
#
# Cite a number from elsewhere by all means — name whose tree it is, or it silently
# becomes a claim about this one.

name: gpu

on:
  workflow_dispatch:

jobs:
  golden-in-browser:
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      # The only step that needs real torch. The expected values are frozen here.
      #
      # **torchvision has to be here.** 14 vision cases call real torchvision (which is
      # what those cases are worth — matching our transforms against our own expected
      # values proves nothing), and without it dump counts those 14 as failures and stops.
      - name: freeze the golden
        run: uv run --with numpy --with torch --with torchvision python tests/golden.py dump

      # borch.ts reads the golden as JSON. It is exported again here so it cannot
      # diverge from the npz.
      - name: export the golden as JSON
        run: uv run --with numpy python tests/export_json.py

      # Fetches Pyodide and locks it by hash. Already present, it only compares.
      # (It was a dependency on a CDN being alive at test time, and it did break once.)
      - name: prepare the outside assets
        run: uv run python tests/browser/vendor.py check

      - name: prepare the browser
        run: uv run --with playwright playwright install chromium

      # Both the core and the GPU path are looked at. They use the same golden, so a
      # divergence says immediately which side it is on.
      - name: compare the core against the golden
        run: uv run --with playwright python tests/browser/run.py --lib borch --headed

      - name: compare the GPU path against the golden
        run: uv run --with playwright python tests/browser/run.py --lib borch_webgpu --headed

      # borch.ts — the very layer the Python binding above sits on. It asks the same
      # golden again in its own language. The browser cannot read TS, so it is emitted
      # as JS first.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: install borch.ts's toolchain
        run: npm ci

      - name: build borch.ts
        run: npm run build:ts

      - name: compare borch.ts against the golden
        run: uv run --with playwright python borch-ts/test/run.py --headed
