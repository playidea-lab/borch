# Publishes the explanation pages, the lessons, the API reference and the playground
# to GitHub Pages.
#
# ## It runs on every push to `main`, and by hand
#
# **It used to be `workflow_dispatch` only**, and the reason written here was that going
# public is a decision a person makes, so on push the next commit *is* the publication.
# That reason was right and it has been spent: the decision was made once, the site is
# up, and from here a published site that lags `main` is a site describing a library
# that has moved. The lesson pages assert what the runtime does; stale, they assert it
# about a runtime nobody is running.
#
# So the person's decision now is the merge, which is where it belongs.
#
# **No path filter.** The successful deployment took 35 seconds, and a filter is a
# second list of what the site is made of — `borch/` and `borch_webgpu/` go up as well
# as `site/`, and a filter that forgets one of them fails by not running, which looks
# exactly like nothing having changed.
#
# ## What made the first two runs fail, since the error did not say
#
# Both ended at `actions/deploy-pages` with `HttpError: Not Found` and the advice
# **"Ensure GitHub Pages has been enabled"**. It was enabled — the API answered with
# `build_type: workflow` and the right URL the whole time. The cause was that **Pages on
# a private repository needs a paid plan**; the deployment API answers 404 without one,
# and the message names the wrong thing. Written down here because the next person to
# meet that 404 will go and check the setting the message points at, and find it fine.
#
# ## Why it goes up in the repository's own shape
#
# The pages call `../borch-ts/dist` and `../../vendor/pyodide` by relative path. Putting
# `site/` alone at the root sends those paths outside the root and every one of them
# 404s. So the repository's shape is kept, and the root holds a one-line page that sends
# the visitor to `/site/`. That leaves fewer places to fix than rewriting the paths for
# deployment.

name: deploy the site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # The emitted files are in `.gitignore`, so they are in no commit. Built here.
      - run: npm run build:ts

      # **The API list is extracted again.** A committed one exists and it may be
      # stale, and deploying with a stale list shows an API the site does not have.
      # `tests/test_site.py` checks the same thing, and a deployment can be pressed
      # without going through the checks.
      - run: python3 site/build_api.py

      # The tutorial data (`site/assets/data/`) is in the repository. There was a time
      # when it was rebuilt here, and that one step took 33 minutes 56 seconds of a
      # 34 minute 20 second deployment — fetching 170MB of originals and processing
      # 60,000 images to produce 1.1MB, repeated on every deployment.

      # Pyodide is inside the repository (`vendor/pyodide/`). Without it Python mode
      # does not run — this stops here rather than quietly publishing half a site.
      #
      # It looks at **whether the bytes match the lock**, not at whether the files
      # exist. While this workflow had never run, what stood here was `test -f`, and the
      # comment above it said "inside the repository" while `vendor/` was in
      # `.gitignore` — the gatekeeper was aimed at a false premise.
      - name: check the vendored assets
        run: python3 tests/browser/vendor.py check

      - name: gather what goes up
        run: |
          mkdir -p _site
          cp -r site borch-ts/dist borch borch_webgpu _site/
          mkdir -p _site/borch-ts && mv _site/dist _site/borch-ts/dist
          mkdir -p _site/vendor && cp -r vendor/pyodide _site/vendor/pyodide
          # **The golden goes up so that `site/check.html` can run it.** 2MB beside a
          # site that is already several, and it is the same file the local runner
          # reads — copied rather than regenerated, so there is no second answer to
          # keep true. The path is kept at `tests/` because the page reaches it as
          # `../tests/golden.json` and the site is served from the repository root
          # locally; one relative path that works in both places.
          mkdir -p _site/tests && cp tests/golden.json _site/tests/golden.json
          cp borchvision.py THIRD-PARTY.md LICENSE _site/
          # Sends the root to the site. The cheapest way that touches no relative path.
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <meta charset="utf-8">
          <title>borch</title>
          <meta http-equiv="refresh" content="0; url=./site/">
          <link rel="canonical" href="./site/">
          <body><p><a href="./site/">borch — Machine Learning, native to the Web</a></p></body>
          </html>
          HTML
          du -sh _site

      # **The share metadata's address is filled in here.** Social crawlers do not
      # follow relative paths, and baking the deployment address into the HTML goes
      # quietly stale when the domain changes. A placeholder is left, and the side doing
      # the deploying fills in the value it knows.
      - name: fill in the share metadata's address
        run: |
          BASE="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          echo "og base: $BASE"
          grep -rl "%OG_BASE%" _site --include="*.html" | xargs sed -i "s|%OG_BASE%|$BASE|g"
          test -z "$(grep -rl '%OG_BASE%' _site --include='*.html')" || (echo "a placeholder is left" && exit 1)

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
