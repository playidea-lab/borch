<!doctype html>
<meta charset="utf-8">
<title>torch.hub.load, on the wheel, in a worker</title>
<body>
<pre id="out">probing…</pre>
<script>
  // **The wheel alone, in a Web Worker** — JupyterLite's shape: Pyodide in a worker,
  // no page-side borch.ts, nothing but `pip install`. The worker installs numpy and the
  // wheel from this checkout, imports `borch_webgpu` (which boots its own borch.ts from
  // the bundle it carries), trains loads a catalogue model with `torch.hub.load`, runs it at 224 px, and posts back what it
  // saw. WebGPU in a worker is Chrome's; JSPI in a worker is what `run_sync` needs.
  const out = document.getElementById("out");
  const wheel = location.origin + new URLSearchParams(location.search).get("wheel");
  // A worker made from a blob URL resolves paths against the blob, so every URL it
  // touches is spelled out with the page's origin.
  const origin = location.origin;
  const code = `
    importScripts(${JSON.stringify(origin + "/vendor/pyodide/pyodide.js")});
    (async () => {
      const t0 = performance.now();
      const say = (s) => postMessage({ say: s });
      try {
        const py = await loadPyodide({ indexURL: ${JSON.stringify(origin + "/vendor/pyodide/")} });
        say("Pyodide " + py.version + " in a worker · navigator.gpu " + (typeof navigator.gpu) + " · WebAssembly.Suspending " + (typeof WebAssembly.Suspending));
        await py.loadPackage("numpy");
        await py.loadPackage(${JSON.stringify(wheel)});
        say("installed the wheel · " + (performance.now() - t0).toFixed(0) + " ms so far");
        const t1 = performance.now();
        const text = await py.runPythonAsync(\`
import time
import js
import borch_webgpu as torch
t = time.perf_counter()
model = torch.hub.load("imagenet-efficientnet-b0")
load_s = time.perf_counter() - t
adapter = str(js.borch.Device.adapterInfo)
faults0 = int(js.borch.device().faults.count)
with torch.no_grad():
    with torch.scope():
        y = model(torch.randn(2, 3, 224, 224))
        shape = tuple(y.shape)
        top = int(y.argmax(1)[0].item())
    # batch 16, warm one, time three
    x = torch.randn(16, 3, 224, 224)
    for i in range(4):
        if i == 1:
            t = time.perf_counter()
        with torch.scope():
            model(x).sum().item()
    per_image = (time.perf_counter() - t) / 3 / 16 * 1000
faults = int(js.borch.device().faults.count) - faults0
name = model.manifest.get("name") if isinstance(model.manifest, dict) else "?"
f"hub {name} loaded in {load_s:.1f} s · out {shape} · argmax {top} · batch 16 {per_image:.1f} ms/image · faults {faults} · adapter {adapter}"
\`);
        postMessage({ done: text, ms: performance.now() - t1 });
      } catch (err) {
        postMessage({ error: String(err && err.stack || err) });
      }
    })();
  `;
  const worker = new Worker(URL.createObjectURL(new Blob([code], { type: "text/javascript" })));
  const lines = [];
  const show = () => { out.textContent = lines.join("\n"); };
  worker.onmessage = (e) => {
    if (e.data.say) { lines.push(e.data.say); show(); }
    if (e.data.done) { lines.push(e.data.done + " · the run " + e.data.ms.toFixed(0) + " ms"); show(); window.__wheel = { text: lines.join("\n"), done: e.data.done }; }
    if (e.data.error) { lines.push("error: " + e.data.error); show(); window.__wheel = { text: lines.join("\n"), ok: false, error: e.data.error }; }
  };
  worker.onerror = (e) => { lines.push("worker error: " + (e.message || e)); show(); window.__wheel = { text: lines.join("\n"), ok: false, error: String(e.message || e) }; };
</script>
</body>
