[package]
name = "burn_resnet18"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
burn = { version = "0.21.0", default-features = false, features = ["std", "wgpu", "autodiff"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"

# rand 0.10 -> getrandom 0.4: wasm32-unknown-unknown에서는 wasm_js 백엔드를 켜야 컴파일된다
[target.'cfg(target_family = "wasm")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
