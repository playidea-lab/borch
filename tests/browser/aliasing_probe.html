<!doctype html>
<meta charset="utf-8">
<title>views and aliasing — the patterns a golden of single ops misses</title>
<body>
<pre id="out">probing…</pre>
<script>
  // **The patterns that break when narrow/select return a view instead of a copy.** The
  // golden tests each op alone on a fresh contiguous tensor, so it never sees several
  // views of one base flowing through a chain and summing their gradients back — the
  // shape a transformer's qkv split has, and the shape that diverged the GPT trajectory
  // three times. Here the same shape is checked against a numpy reference (exact, not a
  // second borch path), and once through the compiler with check=True. It passes today
  // because the ops copy; it becomes the net that catches a view wired wrong.
  const out = document.getElementById("out");
  const q = new URLSearchParams(location.search);
  const wheel = location.origin + q.get("wheel");
  const origin = location.origin;
  const code = `
    importScripts(${JSON.stringify(origin + "/vendor/pyodide/pyodide.js")});
    (async () => {
      const t0 = performance.now();
      const say = (s) => postMessage({ say: s });
      try {
        const py = await loadPyodide({ indexURL: ${JSON.stringify(origin + "/vendor/pyodide/")} });
        say("Pyodide " + py.version + " in a worker");
        await py.loadPackage("numpy");
        await py.loadPackage(${JSON.stringify(wheel)});
        say("installed the wheel · " + (performance.now() - t0).toFixed(0) + " ms so far");
        const text = await py.runPythonAsync(\`
import numpy as np, js
import borch_webgpu as torch

rng = np.random.default_rng(0)
report = []

def rel(got, ref):
    return float(np.abs(got - ref).max() / (np.abs(ref).max() + 1e-6))

# ── Pattern 1: three selects of one base, each into a matmul, gradients summed back ──
# base[i] feeds product i; base.grad[i] = ones(M,N) @ w_i^T. This is the qkv split's
# shape (one tensor cut three ways, three backward paths meeting on the base) isolated.
M, K, N = 5, 4, 3
base_np = rng.standard_normal((3, M, K)).astype(np.float32)
w_np = [rng.standard_normal((K, N)).astype(np.float32) for _ in range(3)]
base = torch.tensor(base_np, requires_grad=True)
ws = [torch.tensor(x) for x in w_np]
parts = [base.select(0, i) for i in range(3)]
acc = parts[0].matmul(ws[0])
for i in (1, 2):
    acc = acc + parts[i].matmul(ws[i])
loss = acc.sum()
loss.backward()
g = base.grad.numpy()
g_ref = np.stack([np.ones((M, N), np.float32) @ w_np[i].T for i in range(3)])
# forward value too: acc = sum_i base[i] @ w_i
fwd_ref = sum(base_np[i] @ w_np[i] for i in range(3))
report.append(("select3 grad", rel(g, g_ref)))
report.append(("select3 fwd", rel(acc.numpy(), fwd_ref)))

# ── Pattern 1b: three narrows of one weight, each into a LINEAR (transposed), summed ──
# MHA's exact shape: inWeight[3E,E] narrowed into q/k/v projection weights, x.linear(w).
# linear reads w transposed, so this is a view feeding a transposed matmul — what
# Pattern 1's plain matmul did not cover, and what diverged the GPT trajectory.
E = 4
xL = rng.standard_normal((6, E)).astype(np.float32)
W_np = rng.standard_normal((3 * E, E)).astype(np.float32)
xt = torch.tensor(xL)
W = torch.tensor(W_np, requires_grad=True)
accL = None
for slot in range(3):
    w = W.narrow(0, slot * E, E)          # [E, E] view of the weight
    p = xt.linear(w)                      # x @ w^T  -> [6, E]
    accL = p if accL is None else accL + p
lossL = accL.sum(); lossL.backward()
gW = W.grad.numpy()
# ref: linear grad for w is ones(6,E)^T @ x = x.sum(0) broadcast; d/dW[slot] = ones(6,E)^T @ x
gslot = np.ones((6, E), np.float32).T @ xL      # [E, E]
gW_ref = np.concatenate([gslot, gslot, gslot], axis=0)
report.append(("narrow3-linear grad", rel(gW, gW_ref)))
fwdL_ref = sum(xL @ W_np[slot * E:(slot + 1) * E].T for slot in range(3))
report.append(("narrow3-linear fwd", rel(accL.numpy(), fwdL_ref)))

# ── Pattern 1c: 1-D narrow of a bias, broadcast-added, three times (MHA's inBias) ──
bflat_np = rng.standard_normal((3 * E,)).astype(np.float32)
xb_np = rng.standard_normal((5, E)).astype(np.float32)
bflat = torch.tensor(bflat_np, requires_grad=True)
xb = torch.tensor(xb_np)
accb = None
for slot in range(3):
    bv = bflat.narrow(0, slot * E, E)      # [E] 1-D view
    p = xb.add(bv)                          # broadcast add [5,E] + [E]
    accb = p if accb is None else accb + p
accb.sum().backward()
gb1 = bflat.grad.numpy()
# ref: each slot's bias gets grad = sum over the 5 rows of ones = 5 per element.
gb1_ref = np.full((3 * E,), 5.0, np.float32)
report.append(("narrow1d-bcast grad", rel(gb1, gb1_ref)))

# ── Pattern 1d: a single-element narrow at an offset (AdamW's hyperScalar) ──
# hyperScalar(i) = hyper().narrow(0, i, 1). If the view reads the wrong slot the
# decay factor is wrong and AdamW drifts — cnn(SGD) is fine, GPT(AdamW) is not.
hh = torch.tensor(np.array([10., 20., 30., 40.], np.float32))
picks = [float(hh.narrow(0, i, 1).numpy()[0]) for i in range(4)]
report.append(("narrow1-scalar", rel(np.array(picks, np.float32), np.array([10, 20, 30, 40], np.float32))))
# and used as a broadcast multiplier, like param.mul(hyperScalar(3))
pm = torch.tensor(np.ones((2, 3), np.float32))
scaled = pm.mul(hh.narrow(0, 3, 1)).numpy()   # should be all 40
report.append(("narrow1-mul", rel(scaled, np.full((2, 3), 40.0, np.float32))))

# ── Pattern 2: narrow into a reshape into a matmul (a view feeding a shape op) ──
# base[a:b] is a contiguous sub-block; reshape then matmul. grad flows to that slice only.
R, C = 6, 4
b2_np = rng.standard_normal((R, C)).astype(np.float32)
w2_np = rng.standard_normal((C * 2, N)).astype(np.float32)
b2 = torch.tensor(b2_np, requires_grad=True)
w2 = torch.tensor(w2_np)
sl = b2.narrow(0, 2, 4)                 # rows 2..5  -> [4, C]
z = sl.reshape([2, C * 2]).matmul(w2)   # [2, N]
loss2 = z.sum()
loss2.backward()
g2 = b2.grad.numpy()
# ref: only rows 2..5 get a gradient; it is ones(2,N) @ w2^T reshaped to [4,C].
gslice = (np.ones((2, N), np.float32) @ w2_np.T).reshape(4, C)
g2_ref = np.zeros((R, C), np.float32); g2_ref[2:6] = gslice
report.append(("narrow-reshape grad", rel(g2, g2_ref)))

# ── Pattern 2b: multi-step AdamW where the weight is narrowed each step ──
# view path (w.narrow) vs a path that breaks the alias (w.narrow then *1, a fresh copy).
# If the view aliases wrongly across the in-place optimizer updates, they drift apart.
def train_narrow(break_alias):
    W2 = torch.tensor(W_np.copy(), requires_grad=True)
    opt = torch.optim.AdamW([W2], lr=0.1)
    one = torch.full([], 1.0)
    for _ in range(8):
        opt.zero_grad()
        acc = None
        for slot in range(3):
            w = W2.narrow(0, slot * E, E)
            if break_alias:
                w = w.mul(one)            # a fresh buffer — no alias to W2
            p = xt.linear(w)
            acc = p if acc is None else acc + p
        acc.sum().backward(); opt.step()
    return W2.numpy()
w_view = train_narrow(False)
w_copy = train_narrow(True)
report.append(("narrow view-vs-copy 8 AdamW steps", rel(w_view, w_copy)))

# ── Pattern 3: the same select-3 pattern inside torch.compiled(check=True) ──
# A step that cuts a base three ways and updates it; check=True holds the replay to the
# eager step, and the recording must not throw on the aliased views.
def cap_case(use_select, use_arena, fuse=True):
    p = torch.tensor(base_np.copy(), requires_grad=True)
    opt = (torch.optim.SGD if use_arena else torch.optim.Adam)([p], lr=0.1)
    ws3 = [torch.tensor(x) for x in w_np]
    wfull = torch.tensor(rng.standard_normal((K, N)).astype(np.float32))
    def step():
        opt.zero_grad()
        if use_select:
            a = p.select(0, 0).matmul(ws3[0]).sum()
            a = a + p.select(0, 1).matmul(ws3[1]).sum()
            a = a + p.select(0, 2).matmul(ws3[2]).sum()
        else:
            a = p.matmul(wfull).sum()   # no select — whole base through matmul
        a.backward(); opt.step()
        return a
    try:
        fn = torch.compiled(step, check=True, fuse=fuse)
        with torch.scope():
            fn(); fn()
        return "ok"
    except Exception as e:
        return "ERR " + str(e)[:80]
cap_note = ("SGD+sel " + cap_case(True, True) + " | Adam+sel " + cap_case(True, False)
            + " | SGD+nosel " + cap_case(False, True))

# ── Regression: no_grad restores prior state (nesting) ──
with torch.no_grad():
    inner_ok = not torch.is_grad_enabled()
    with torch.no_grad():
        pass
    outer_still = not torch.is_grad_enabled()   # must still be no_grad after inner exits
report.append(("no_grad nests", 0.0 if (inner_ok and outer_still) else 1.0))

# ── Regression: an SGD parameter that gets no gradient must not drift (arena zeroing) ──
pg = torch.tensor(rng.standard_normal((5,)).astype(np.float32), requires_grad=True)
pf = torch.tensor(rng.standard_normal((4,)).astype(np.float32), requires_grad=True)  # frozen: never gets a grad
pf0 = pf.numpy().copy()
optf = torch.optim.SGD([pg, pf], lr=0.1, momentum=0.9)
for _ in range(4):
    optf.zero_grad()
    pg.sum().backward()      # only pg gets a gradient; pf gets none
    optf.step()
report.append(("frozen SGD param unchanged", rel(pf.numpy(), pf0)))

worst = max(v for _, v in report)
adapter = str(js.borch.Device.adapterInfo)
"aliasing: " + " · ".join(f"{n} {v:.1e}" for n, v in report) + " · " + cap_note + \\
    f" · worst {worst:.1e} · faults {int(js.borch.device().faults.count)} · adapter {adapter}"
\`);
        postMessage({ done: text, ms: performance.now() - t0 });
      } catch (err) {
        postMessage({ error: String(err && err.stack || err) });
      }
    })();
  `;
  const worker = new Worker(URL.createObjectURL(new Blob([code], { type: "text/javascript" })));
  const lines = [];
  const show = () => { out.textContent = lines.join("\n"); };
  worker.onmessage = (e) => {
    if (e.data.say) { lines.push(e.data.say); show(); }
    if (e.data.done) { lines.push(e.data.done + " · the run " + e.data.ms.toFixed(0) + " ms"); show(); window.__wheel = { text: lines.join("\n"), done: lines.join("\n") }; worker.terminate(); }
    if (e.data.error) { lines.push("error: " + e.data.error); show(); window.__wheel = { text: lines.join("\n"), ok: false, error: e.data.error }; worker.terminate(); }
  };
  worker.onerror = (e) => { lines.push("worker error: " + (e.message || e)); show(); window.__wheel = { text: lines.join("\n"), ok: false, error: String(e.message || e) }; };
</script>
