<!doctype html>
<meta charset="utf-8">
<title>readback probe</title>
<body>
<pre id="out">probing…</pre>
<script type="module">
  // **How long does one value take to come back from the GPU?** Bare WebGPU — no
  // borch — so the answer is the browser's and the driver's alone. Three shapes of the
  // round trip, each many times: write → mapAsync; submit → onSubmittedWorkDone; a
  // one-thread compute dispatch → copy → mapAsync. And the page's own frame clock
  // (requestAnimationFrame), because a readback that waits for a frame waits for
  // whatever the display gives.
  const out = document.getElementById("out");
  const lines = [];
  const say = (s) => { lines.push(s); out.textContent = lines.join("\n"); };
  const ROUNDS = 12;
  const med = (xs) => { const s = [...xs].sort((a, b) => a - b); return s[Math.floor(s.length / 2)]; };
  const fmt = (xs) => `median ${med(xs).toFixed(1)} ms · min ${Math.min(...xs).toFixed(1)} · max ${Math.max(...xs).toFixed(1)}`;
  try {
    const adapter = await navigator.gpu.requestAdapter();
    const info = adapter.info ?? {};
    const device = await adapter.requestDevice();
    say(`adapter: ${info.vendor ?? "?"} / ${info.architecture ?? "?"} · visibility ${document.visibilityState}`);

    // 1) requestAnimationFrame interval — the display's tick as the page sees it.
    const frames = [];
    let last = performance.now();
    await new Promise((resolve) => {
      const tick = () => { const now = performance.now(); frames.push(now - last); last = now; if (frames.length < 8) requestAnimationFrame(tick); else resolve(); };
      requestAnimationFrame(tick);
    });
    say(`rAF interval: ${fmt(frames.slice(1))}`);

    // 2) write → mapAsync
    const read = device.createBuffer({ size: 16, usage: GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST });
    const src = device.createBuffer({ size: 16, usage: GPUBufferUsage.COPY_SRC | GPUBufferUsage.COPY_DST });
    const wm = [];
    for (let i = 0; i < ROUNDS; i++) {
      device.queue.writeBuffer(src, 0, new Float32Array([i, 0, 0, 0]));
      const enc = device.createCommandEncoder();
      enc.copyBufferToBuffer(src, 0, read, 0, 16);
      device.queue.submit([enc.finish()]);
      const t0 = performance.now();
      await read.mapAsync(GPUMapMode.READ);
      wm.push(performance.now() - t0);
      read.unmap();
    }
    say(`copy → mapAsync: ${fmt(wm)}`);

    // 3) submit → onSubmittedWorkDone
    const wd = [];
    for (let i = 0; i < ROUNDS; i++) {
      const enc = device.createCommandEncoder();
      enc.copyBufferToBuffer(src, 0, read, 0, 16);
      device.queue.submit([enc.finish()]);
      const t0 = performance.now();
      await device.queue.onSubmittedWorkDone();
      wd.push(performance.now() - t0);
    }
    say(`submit → onSubmittedWorkDone: ${fmt(wd)}`);

    // 4) a one-thread dispatch → copy → mapAsync
    const shader = device.createShaderModule({ code: `
      @group(0) @binding(0) var<storage, read_write> o: array<f32>;
      @compute @workgroup_size(1) fn main() { o[0] = o[0] + 1.0; }` });
    const pipeline = device.createComputePipeline({ layout: "auto", compute: { module: shader, entryPoint: "main" } });
    const store = device.createBuffer({ size: 16, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC });
    const bind = device.createBindGroup({ layout: pipeline.getBindGroupLayout(0), entries: [{ binding: 0, resource: { buffer: store } }] });
    const dm = [];
    for (let i = 0; i < ROUNDS; i++) {
      const enc = device.createCommandEncoder();
      const pass = enc.beginComputePass();
      pass.setPipeline(pipeline); pass.setBindGroup(0, bind); pass.dispatchWorkgroups(1); pass.end();
      enc.copyBufferToBuffer(store, 0, read, 0, 16);
      const t0 = performance.now();
      device.queue.submit([enc.finish()]);
      await read.mapAsync(GPUMapMode.READ);
      dm.push(performance.now() - t0);
      read.unmap();
    }
    say(`dispatch → copy → mapAsync: ${fmt(dm)}`);

    // 5) the same, with a requestAnimationFrame loop running — a page that animates.
    let running = true;
    const spin = () => { if (running) requestAnimationFrame(spin); };
    requestAnimationFrame(spin);
    const am = [];
    for (let i = 0; i < ROUNDS; i++) {
      const enc = device.createCommandEncoder();
      enc.copyBufferToBuffer(src, 0, read, 0, 16);
      const t0 = performance.now();
      device.queue.submit([enc.finish()]);
      await read.mapAsync(GPUMapMode.READ);
      am.push(performance.now() - t0);
      read.unmap();
    }
    running = false;
    say(`copy → mapAsync while a rAF loop runs: ${fmt(am)}`);

    // 6) mapAsync with a setTimeout(0) spinning — is it a timer starvation?
    const tm = [];
    for (let i = 0; i < ROUNDS; i++) {
      const enc = device.createCommandEncoder();
      enc.copyBufferToBuffer(src, 0, read, 0, 16);
      const t0 = performance.now();
      device.queue.submit([enc.finish()]);
      const keep = setInterval(() => {}, 0);
      await read.mapAsync(GPUMapMode.READ);
      clearInterval(keep);
      tm.push(performance.now() - t0);
      read.unmap();
    }
    say(`copy → mapAsync with a 0 ms interval timer ticking: ${fmt(tm)}`);

    // 7) **The learner's shape**: work, then quiet, then a readback. The page does nothing
    // for 300 ms between the submit and the map — as a Python loop printing its loss
    // does — and asks how long the map then waits, bare, and with a 0 ms timer alive.
    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
    const idle = [];
    for (let i = 0; i < 6; i++) {
      const enc = device.createCommandEncoder();
      enc.copyBufferToBuffer(src, 0, read, 0, 16);
      device.queue.submit([enc.finish()]);
      await sleep(300);
      const t0 = performance.now();
      await read.mapAsync(GPUMapMode.READ);
      idle.push(performance.now() - t0);
      read.unmap();
    }
    say(`submit, idle 300 ms, then mapAsync: ${fmt(idle)}`);
    const idleT = [];
    for (let i = 0; i < 6; i++) {
      const enc = device.createCommandEncoder();
      enc.copyBufferToBuffer(src, 0, read, 0, 16);
      device.queue.submit([enc.finish()]);
      await sleep(300);
      const keep = setInterval(() => {}, 4);
      const t0 = performance.now();
      await read.mapAsync(GPUMapMode.READ);
      idleT.push(performance.now() - t0);
      clearInterval(keep);
      read.unmap();
    }
    say(`the same with a 4 ms interval timer alive during the map: ${fmt(idleT)}`);

    // 8) **Making a pipeline.** Each distinct kernel in a network is one
    // createComputePipeline; if that is where a second goes, a loop with seven kernels
    // costs seven seconds once. Eight pipelines that differ by a constant, timed one by
    // one: the call itself, and the first dispatch → map through it.
    const mk = [], first = [];
    for (let i = 0; i < 8; i++) {
      const t0 = performance.now();
      const mod = device.createShaderModule({ code: `
        @group(0) @binding(0) var<storage, read_write> o: array<f32>;
        @compute @workgroup_size(1) fn main() { o[0] = o[0] + ${i + 1}.0; }` });
      const pl = device.createComputePipeline({ layout: "auto", compute: { module: mod, entryPoint: "main" } });
      mk.push(performance.now() - t0);
      const bg = device.createBindGroup({ layout: pl.getBindGroupLayout(0), entries: [{ binding: 0, resource: { buffer: store } }] });
      const enc = device.createCommandEncoder();
      const pass = enc.beginComputePass();
      pass.setPipeline(pl); pass.setBindGroup(0, bg); pass.dispatchWorkgroups(1); pass.end();
      enc.copyBufferToBuffer(store, 0, read, 0, 16);
      const t1 = performance.now();
      device.queue.submit([enc.finish()]);
      await read.mapAsync(GPUMapMode.READ);
      first.push(performance.now() - t1);
      read.unmap();
    }
    say(`createComputePipeline (8 distinct): ${fmt(mk)}`);
    say(`first dispatch → map through each new pipeline: ${fmt(first)}`);
    const mkA = [];
    for (let i = 0; i < 4; i++) {
      const t0 = performance.now();
      const mod = device.createShaderModule({ code: `
        @group(0) @binding(0) var<storage, read_write> o: array<f32>;
        @compute @workgroup_size(1) fn main() { o[0] = o[0] * ${i + 2}.0; }` });
      await device.createComputePipelineAsync({ layout: "auto", compute: { module: mod, entryPoint: "main" } });
      mkA.push(performance.now() - t0);
    }
    say(`createComputePipelineAsync (4 distinct): ${fmt(mkA)}`);

    window.__readback = { text: lines.join("\n"), adapter: `${info.vendor ?? "?"} / ${info.architecture ?? "?"}`,
      medians: { raf: med(frames.slice(1)), map: med(wm), workDone: med(wd), dispatchMap: med(dm), rafMap: med(am), timerMap: med(tm), idleMap: med(idle), idleTimerMap: med(idleT), idleMax: Math.max(...idle), idleTimerMax: Math.max(...idleT), pipeline: med(mk), pipelineMax: Math.max(...mk), firstDispatch: med(first), firstDispatchMax: Math.max(...first), pipelineAsync: med(mkA) } };
  } catch (err) {
    window.__readback = { error: String(err && err.stack || err) };
    say(`the probe blew up: ${err}`);
  }
</script>
</body>
