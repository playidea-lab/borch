<!doctype html>
<meta charset="utf-8">
<title>the frozen-weight window — offset slices of one buffer</title>
<script type="importmap">
{ "imports": { "borch-ts": "/borch-ts/dist/src/index.js" } }
</script>
<body>
<pre id="out">measuring…</pre>
<script type="module">
  // **Step 3 of docs/SCALE.md, the primitive.** A window is one STORAGE buffer holding
  // several weights end to end, each filled through a staging buffer and copyRange (never
  // writeBuffer), each bound as an offset slice. This proves the mechanism: two arrays go
  // into two slots of one buffer, a kernel reads each slice at its own offset, and the
  // values come back intact. Adapter-independent — copyRange and slice bindings are core
  // WebGPU, so this runs on Apple, the RTX 5080, and SwiftShader alike.
  const out = document.getElementById("out");
  const lines = [];
  const say = (s) => { lines.push(s); out.textContent = lines.join("\n"); };
  try {
    const { init, device, Device, Tensor, f32ToF16Bits, f16BitsToF32, streamSequential } = await import("borch-ts");
    const K = await import("/borch-ts/dist/src/kernels.js");
    await init();
    const dev = device();
    say(`adapter: ${Device.adapterInfo} · storage align ${dev.storageAlign}`);

    const win = dev.window(1 << 20);   // 1 MiB
    const a = new Float32Array([1, 2, 3, 4, 5]);
    const b = new Float32Array([10, 11, 12, 13, 14]);
    const slotA = await win.place(a);
    const slotB = await win.place(b);

    const sameBuffer = slotA.buffer === win.buffer && slotB.buffer === win.buffer;
    const align = dev.storageAlign;
    const offsetsOk = slotA.offset === 0 && slotB.offset === align && slotB.offset % align === 0;
    say(`slot A: offset ${slotA.offset} size ${slotA.size} · slot B: offset ${slotB.offset} size ${slotB.size}`);
    say(`both slices of one buffer: ${sameBuffer} · offsets aligned & distinct: ${offsetsOk}`);
    say(`window used: ${win.used} bytes (two ${align}-aligned slots)`);

    // A kernel reading a slice at its offset: relu over n scalars (identity on positives),
    // so the readback is the slot's own bytes if and only if the offset binding is right.
    const readSlot = async (slot, n) => {
      const outBuf = dev.alloc(n);
      dev.run1d(dev.pipeline(`winrelu:${n}`, () => K.unaryForward("relu", n)), [slot, outBuf], n);
      return Array.from(await dev.read(outBuf, n));
    };
    const ra = await readSlot(slotA, 5);
    const rb = await readSlot(slotB, 5);
    const eq = (x, y) => x.length === y.length && x.every((v, i) => v === y[i]);
    const aOk = eq(ra, [...a]);
    const bOk = eq(rb, [...b]);
    say(`slot A read back: [${ra}] — ${aOk ? "ok" : "WRONG"}`);
    say(`slot B read back: [${rb}] — ${bOk ? "ok" : "WRONG"}`);

    // Refill slot A's region with new bytes through the staging path, read again — the
    // window buffer is reused in place, which is what the scheduler will do per block.
    const win2 = dev.window(1 << 20);
    const c = new Float32Array([7, 8, 9, 10, 11]);
    const slotC = await win2.place(c);
    const rc = await readSlot(slotC, 5);
    const cOk = eq(rc, [...c]);
    say(`fresh window slot read back: [${rc}] — ${cOk ? "ok" : "WRONG"}`);

    // **A matmul reads a windowed weight as a slice.** The weight goes into a window and
    // `x @ W` must equal the same product with W as an ordinary tensor — same kernel, same
    // values, so bit-identical. Two shapes: one whole-eights (the subgroup path where the
    // device has it) and one that is not (the scalar tile).
    const seed = (n, s) => { const a = new Float32Array(n); let x = s >>> 0; for (let i = 0; i < n; i++) { x ^= x << 13; x >>>= 0; x ^= x >>> 17; x ^= x << 5; x >>>= 0; a[i] = x / 4294967296 - 0.5; } return a; };
    const matmulThroughWindow = async (M, Kd, N, s) => {
      const xd = seed(M * Kd, s), wd = seed(Kd * N, s + 7);
      const x = Tensor.from(xd, [M, Kd]);
      const ref = Array.from(await x.matmul(Tensor.from(wd, [Kd, N])).toArray());
      const w3 = dev.window(1 << 20);
      const { weight: wWin } = await Tensor.inWindow(w3, wd, [Kd, N]);
      const got = Array.from(await x.matmul(wWin).toArray());
      w3.free();
      const eqf = ref.length === got.length && ref.every((v, i) => v === got[i]);
      return { eqf, ref, got };
    };
    const sub = await matmulThroughWindow(16, 16, 16, 3);      // whole eights
    const scl = await matmulThroughWindow(6, 10, 7, 9);        // not
    say(`matmul windowed weight == normal (16x16x16, subgroup-eligible): ${sub.eqf ? "ok" : "WRONG"}`);
    say(`matmul windowed weight == normal (6x10x7, scalar tile): ${scl.eqf ? "ok" : "WRONG"}`);

    // **A conv reads a windowed weight too.** Same check for the other weight funnel:
    // x conv W with W windowed must equal W as an ordinary tensor. Two shapes to cover the
    // direct kernel and the tiled one.
    const convThroughWindow = async (N, C, H, O, kh, s) => {
      const xd = seed(N * C * H * H, s), wd = seed(O * C * kh * kh, s + 5);
      const x = Tensor.from(xd, [N, C, H, H]);
      const ref = Array.from(await x.conv2d(Tensor.from(wd, [O, C, kh, kh]), null, 1, 1).toArray());
      const cw = dev.window(1 << 20);
      const { weight: wWin } = await Tensor.inWindow(cw, wd, [O, C, kh, kh]);
      const got = Array.from(await x.conv2d(wWin, null, 1, 1).toArray());
      cw.free();
      return ref.length === got.length && ref.every((v, i) => v === got[i]);
    };
    const convA = await convThroughWindow(1, 3, 8, 4, 3, 21);     // small — direct kernel
    const convB = await convThroughWindow(1, 16, 16, 16, 3, 33);  // larger — tiled kernel
    say(`conv2d windowed weight == normal (3->4, 8x8): ${convA ? "ok" : "WRONG"}`);
    say(`conv2d windowed weight == normal (16->16, 16x16): ${convB ? "ok" : "WRONG"}`);

    // A windowed weight is a weight operand only — a generic op must refuse it, not read
    // the window from offset 0 (another slot's values).
    let refusedGeneric = false;
    {
      const w4 = dev.window(1 << 20);
      const { weight: ww } = await Tensor.inWindow(w4, new Float32Array([1, 2, 3, 4]), [2, 2]);
      try { await ww.add(Tensor.from(new Float32Array([1, 1, 1, 1]), [2, 2])).toArray(); }
      catch (e) { refusedGeneric = /window|weight operand/.test(String(e)); }
      w4.free();
    }
    say(`a windowed weight refuses a generic op: ${refusedGeneric ? "yes" : "NO"}`);

    // **Eviction is a loud stale read, not a silent one** (ADR-003 decision 2). A windowed
    // weight works, then its slot is evicted, and using it again must throw — not read
    // whatever the scheduler placed there next.
    let evictWorks = false, evictThrows = false;
    {
      const ew = dev.window(1 << 20);
      const wd = seed(16 * 16, 41);
      const x = Tensor.from(seed(16 * 16, 42), [16, 16]);
      const { weight: wWin, evict } = await Tensor.inWindow(ew, wd, [16, 16]);
      const before = Array.from(await x.matmul(wWin).toArray());
      const ref = Array.from(await x.matmul(Tensor.from(wd, [16, 16])).toArray());
      evictWorks = before.length === ref.length && before.every((v, i) => v === ref[i]);
      evict();
      try { await x.matmul(wWin).toArray(); }
      catch (e) { evictThrows = /evicted/.test(String(e)); }
      ew.free();
    }
    say(`a windowed weight works before eviction: ${evictWorks ? "yes" : "NO"}`);
    say(`using an evicted weight throws (not a silent wrong read): ${evictThrows ? "yes" : "NO"}`);

    // **Bounded streaming — the point of the window** (Step 3 ④). Run more blocks than fit
    // at once: place block k, matmul, evict, and the freed region serves block k+1. A window
    // sized for three blocks streams twenty-four, so the buffer never grows past the
    // resident set — that is how a model larger than the window fits.
    let streamOk = true, streamBounded = false;
    {
      const M = 8, Kd = 16, Nn = 16, B = 24;
      const need = Math.ceil(Kd * Nn * 4 / align) * align;
      const cap = 3 * need;                 // room for three blocks, not twenty-four
      const sw = dev.window(cap);
      const x = Tensor.from(seed(M * Kd, 1), [M, Kd]);
      for (let i = 0; i < B; i++) {
        const wd = seed(Kd * Nn, 100 + i);
        const { weight, evict } = await Tensor.inWindow(sw, wd, [Kd, Nn]);
        const got = Array.from(await x.matmul(weight).toArray());
        const ref = Array.from(await x.matmul(Tensor.from(wd, [Kd, Nn])).toArray());
        if (!(got.length === ref.length && got.every((v, j) => v === ref[j]))) streamOk = false;
        evict();
      }
      streamBounded = sw.used <= cap;       // 24 blocks streamed, buffer stayed at 3
      say(`streamed ${B} blocks through a 3-block window: results ${streamOk ? "ok" : "WRONG"}, `
        + `used ${(sw.used / 1024).toFixed(1)}KB <= cap ${(cap / 1024).toFixed(1)}KB: ${streamBounded}`);
      sw.free();
    }

    // **A half-precision window weight — half the bytes, unpacked on use** (Step 3 ⑤). The
    // stored values are f16-rounded (lossy, like .half()), so the reference is the same
    // weight rounded to f16 on the host; feeding both the same f16-rounded f32 values to the
    // matmul gives bit-identical results. And the f16 slot is half an f32 slot's bytes.
    let f16Eq = false, f16Half = false;
    {
      const M = 8, Kd = 16, Nn = 16;
      const wd = seed(Kd * Nn, 77);
      const rounded = f16BitsToF32(f32ToF16Bits(wd));   // the exact values the window holds
      const x = Tensor.from(seed(M * Kd, 78), [M, Kd]);
      const ref = Array.from(await x.matmul(Tensor.from(rounded, [Kd, Nn])).toArray());
      const fw = dev.window(1 << 20);
      const { weight } = await Tensor.inWindowF16(fw, wd, [Kd, Nn]);
      // Count the dispatches the f16 matmul makes: 1 where the device reads f16 directly
      // (Device.f16), 2 where it unpacks first (unpack + matmul). Both give the same value.
      const d0 = dev.dispatches;
      const gt = x.matmul(weight);
      const f16Dispatch = dev.dispatches - d0;
      const got = Array.from(await gt.toArray());
      const pathOk = Device.f16 ? f16Dispatch === 1 : f16Dispatch === 2;
      say(`f16 matmul path: ${f16Dispatch} dispatch(es) — ${Device.f16 ? "direct f16 read" : "unpack fallback"} (${pathOk ? "as expected" : "UNEXPECTED"})`);
      const f16Live = fw.live;
      fw.free();
      // What the same weight would reserve as f32, for the halving comparison.
      const gw = dev.window(1 << 20);
      await Tensor.inWindow(gw, wd, [Kd, Nn]);
      const f32Live = gw.live;
      gw.free();
      f16Eq = (ref.length === got.length && ref.every((v, i) => v === got[i])) && pathOk;
      f16Half = f16Live <= f32Live / 2;
      say(`f16 window weight == host f16-rounded (matmul): ${f16Eq ? "ok" : "WRONG"}`);
      say(`f16 slot is half an f32 slot: ${f16Live}B vs ${f32Live}B — ${f16Half ? "yes" : "NO"}`);
    }

    // **A whole sequential network streamed through the window** (Step 3 ④ scheduler). Ten
    // Linear+ReLU blocks: run resident, then stream through a window sized for three, and
    // the output must match — the model is larger than the window, yet the answer is the
    // same, with residency bounded. This is what the scheduler delivers.
    let netEq = false, netBounded = false;
    {
      const D = 16, NB = 10;
      const need = Math.ceil(D * D * 4 / align) * align;
      const Ws = [];
      for (let i = 0; i < NB; i++) Ws.push(seed(D * D, 200 + i));
      const x0 = Tensor.from(seed(4 * D, 199), [4, D]);
      let hr = x0;
      for (const w of Ws) hr = hr.matmul(Tensor.from(w, [D, D])).relu();
      const ref = Array.from(await hr.toArray());
      const nw = dev.window(3 * need);   // room for three blocks, not ten
      const blocks = Ws.map((w) => ({
        weights: [w], shapes: [[D, D]],
        run: (h, ws) => h.matmul(ws[0]).relu(),
      }));
      const hs = await streamSequential(nw, x0, blocks);
      const got = Array.from(await hs.toArray());
      netBounded = nw.used <= 3 * need;
      nw.free();
      netEq = ref.length === got.length && ref.every((v, i) => v === got[i]);
      say(`10-block net streamed through a 3-block window == resident: ${netEq ? "ok" : "WRONG"} `
        + `(used <= 3 blocks: ${netBounded})`);
    }

    win.free();
    win2.free();
    say(`faults: ${dev.faults.count}`);
    const ok = sameBuffer && offsetsOk && aOk && bOk && cOk && win.used === 2 * align
      && sub.eqf && scl.eqf && convA && convB && refusedGeneric && evictWorks && evictThrows
      && streamOk && streamBounded && f16Eq && f16Half && netEq && netBounded && dev.faults.count === 0;
    say(ok ? "\nwindow: offset slices of one buffer fill and read back intact" : "\n**window: a check did not hold**");
    window.__window = { text: lines.join("\n"), ok, sameBuffer, offsetsOk, aOk, bOk, cOk, subEq: sub.eqf, sclEq: scl.eqf, convA, convB, refusedGeneric, evictWorks, evictThrows, streamOk, streamBounded, f16Eq, f16Half, netEq, netBounded, used: win.used, faults: dev.faults.count };
  } catch (err) {
    window.__window = { error: String(err && err.stack || err), text: lines.join("\n") };
    say(`it could not be measured: ${err}`);
  }
</script>
</body>
