<!doctype html>
<meta charset="utf-8">
<title>the pool, filled with a sentinel — does any op read what it did not write</title>
<body>
<pre id="out">probing…</pre>
<script>
  // **A pooled alloc is not zero-initialised — only a brand-new GPUBuffer is (WebGPU zeroes
  // those; a reused one carries the last tenant's bytes).** So an op whose backward
  // allocates a full-size buffer and writes only part of it — a gradient scattered back to
  // the rows that were used, the rest meant to stay zero — is correct only as long as those
  // bytes happen to be zero. The goldens never catch it: each runs on a clean page, the pool
  // never stirred, the bytes zero by luck. Two sites of the class were found and fixed (a
  // view's backward, the SGD arena); an audit called the rest sealed. This is the net for it.
  //
  // The pool is deliberately filled with a loud sentinel first — many buffers at each of the
  // byte sizes the step will reuse, enough that a forward's allocations cannot exhaust them
  // before the backward's do. Then the step runs on fixed inputs and its gradient is compared
  // to a numpy reference: an op that reads a byte it did not write reads the sentinel, and its
  // gradient departs from the reference. A low-level control proves the sentinel actually
  // reaches a pooled allocation (empty() would not show it — borch's empty is zeros).
  const out = document.getElementById("out");
  const q = new URLSearchParams(location.search);
  const wheel = location.origin + q.get("wheel");
  const origin = location.origin;
  const code = `
    importScripts(${JSON.stringify(origin + "/vendor/pyodide/pyodide.js")});
    (async () => {
      const t0 = performance.now();
      const say = (s) => postMessage({ say: s });
      try {
        const py = await loadPyodide({ indexURL: ${JSON.stringify(origin + "/vendor/pyodide/")} });
        say("Pyodide " + py.version + " in a worker");
        await py.loadPackage("numpy");
        await py.loadPackage(${JSON.stringify(wheel)});
        say("installed the wheel · " + (performance.now() - t0).toFixed(0) + " ms so far");
        const text = await py.runPythonAsync(\`
import numpy as np, js
from pyodide.ffi import run_sync
import borch_webgpu as torch

F = torch.nn.functional
SENTINEL = 987654.0    # loud, finite, nowhere near a real gradient or zero
report = []

def rel(got, ref):
    ref = np.asarray(ref, np.float32); got = np.asarray(got, np.float32)
    return float(np.abs(got - ref).max() / (np.abs(ref).max() + 1e-6))

def poison_pool():
    # Fill the spare pool with the sentinel across every small byte size, many buffers each.
    # Uploads go through a fresh buffer that returns to the pool when the scope closes, so
    # after this the pool holds sentinel buffers at sizes 1..64 floats (our shapes are ≤ 24)
    # and a few larger — far more per size than one forward+backward will draw.
    with torch.scope():
        for n in list(range(1, 65)) + [96, 128, 256, 512, 1024]:
            for _ in range(8):
                torch.tensor(np.full([n], SENTINEL, np.float32))

# ── The control: the sentinel really reaches a pooled allocation ──
# borch's empty() is zeros(), so it cannot show this. The device's own alloc() pops a spare
# buffer and does not clear it; read it raw. If it is not the sentinel, the poison never
# landed and every green below would be meaningless.
dev = js.borch.device()
poison_pool()
raw = dev.alloc(256)                       # 256 floats = 1024 bytes — a size we just poisoned
control = float(np.abs(np.asarray(run_sync(dev.read(raw, 256)).to_py(), np.float32)).max())
mechanism = "PROVEN" if control > 1.0 else "VACUOUS(poison did not land!)"

# ── The gradient cases: backward scatters into a full-size buffer, the rest must be zero ──
# Each builds fixed leaves (seeded), runs forward→sum→backward, and returns (grad, reference).
def c_embedding():
    w = torch.tensor(rng.standard_normal((6, 4)).astype(np.float32), requires_grad=True)
    idx = torch.tensor(np.array([1, 3, 3, 5], np.int64))
    F.embedding(idx, w).sum().backward()
    ref = np.zeros((6, 4), np.float32); ref[1] = 1; ref[3] = 2; ref[5] = 1
    return [(w.grad, ref)]

def c_index_select():
    x = torch.tensor(rng.standard_normal((5, 4)).astype(np.float32), requires_grad=True)
    idx = torch.tensor(np.array([2, 0, 2], np.int64))
    x.index_select(0, idx).sum().backward()
    ref = np.zeros((5, 4), np.float32); ref[0] = 1; ref[2] = 2
    return [(x.grad, ref)]

def c_narrow():
    x = torch.tensor(rng.standard_normal((6, 4)).astype(np.float32), requires_grad=True)
    x.narrow(0, 2, 3).sum().backward()
    ref = np.zeros((6, 4), np.float32); ref[2:5] = 1
    return [(x.grad, ref)]

def c_select():
    x = torch.tensor(rng.standard_normal((6, 4)).astype(np.float32), requires_grad=True)
    x.select(0, 1).sum().backward()
    ref = np.zeros((6, 4), np.float32); ref[1] = 1
    return [(x.grad, ref)]

def c_amax():
    # grad is 1 at each row's argmax, 0 elsewhere — a scatter into a zero buffer whose
    # positions come from the data, so the reference is read off x itself.
    xv = rng.standard_normal((6, 4)).astype(np.float32)
    x = torch.tensor(xv, requires_grad=True)
    x.amax(1).sum().backward()
    ref = np.zeros((6, 4), np.float32)
    ref[np.arange(6), xv.argmax(1)] = 1
    return [(x.grad, ref)]

CASES = [("embedding", c_embedding), ("index_select", c_index_select),
         ("narrow", c_narrow), ("select", c_select), ("amax", c_amax)]

for name, case in CASES:
    poison_pool()
    rng = np.random.default_rng(4242)     # fixed, so the leaves (and the reference) are set
    with torch.scope():
        pairs = case()
        worst_case = max(rel(g.numpy(), ref) for g, ref in pairs)
    report.append((name, worst_case))

# ── Forward zero-init: a constant-pad border, and a fresh zeros(), must read zero from a
# sentinel-filled pool ──
poison_pool()
rng = np.random.default_rng(7)
with torch.scope():
    y = F.pad(torch.tensor(rng.standard_normal((4, 4)).astype(np.float32)), (1, 1, 1, 1)).numpy()
    border = np.concatenate([y[0], y[-1], y[:, 0], y[:, -1]])
report.append(("pad border zero", float(np.abs(border).max())))

poison_pool()
with torch.scope():
    report.append(("zeros() is zero", float(np.abs(torch.zeros([300]).numpy()).max())))

worst = max(v for _, v in report)
adapter = str(js.borch.Device.adapterInfo)
"churn: " + " · ".join(f"{n} {v:.1e}" for n, v in report) + \\
    f" · control sentinel-in-alloc {control:.1e} [{mechanism}]" + \\
    f" · worst {worst:.1e} · faults {int(js.borch.device().faults.count)} · adapter {adapter}"
\`);
        postMessage({ done: text, ms: performance.now() - t0 });
      } catch (err) {
        postMessage({ error: String(err && err.stack || err) });
      }
    })();
  `;
  const worker = new Worker(URL.createObjectURL(new Blob([code], { type: "text/javascript" })));
  const lines = [];
  const show = () => { out.textContent = lines.join("\n"); };
  worker.onmessage = (e) => {
    if (e.data.say) { lines.push(e.data.say); show(); }
    if (e.data.done) { lines.push(e.data.done + " · the run " + e.data.ms.toFixed(0) + " ms"); show(); window.__wheel = { text: lines.join("\n"), done: lines.join("\n") }; worker.terminate(); }
    if (e.data.error) { lines.push("error: " + e.data.error); show(); window.__wheel = { text: lines.join("\n"), ok: false, error: e.data.error }; worker.terminate(); }
  };
  worker.onerror = (e) => { lines.push("worker error: " + (e.message || e)); show(); window.__wheel = { text: lines.join("\n"), ok: false, error: String(e.message || e) }; };
</script>
