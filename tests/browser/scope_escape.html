<!doctype html>
<meta charset="utf-8">
<title>구역 밖으로 텐서를 들고 나올 수 있는가</title>
<body>
<pre id="out">재는 중…</pre>
<script src="/vendor/pyodide/pyodide.js"></script>
<script type="module">
  /*
   * 묻는 것: **파이썬에서 `with torch.scope():` 를 나온 뒤에도 텐서를 쓸 수 있는가.**
   *
   * borch.ts 에는 `keepAlive(t)` 와 `scope(body, () => [t])` 가 둘 다 있는데 결속에는
   * 어느 쪽도 없었다. 그래서 학습 루프에서 손실값조차 못 읽었다.
   *
   * 그리고 둘은 **같은 것이 아니다.** `keepAlive` 는 `Device.keep` 을 불러 어떤
   * 구역도 안 놓는 집합에 넣고, `endScope(keep)` 은 바깥 구역으로 넘긴다. 하나만
   * 이으면 새거나 못 쓰거나 둘 중 하나가 된다 — 그래서 여기서 그 차이를 잰다.
   */
  const out = document.getElementById("out");
  const lines = [];
  const say = (s) => { lines.push(s); out.textContent = lines.join("\n"); };

  const PACKAGES = {
    borch: ["__init__", "_base", "_tensor", "_ops", "_fft", "_nn", "_optim",
            "_data", "_rnn", "_serialize"],
    borch_webgpu: ["__init__", "_base", "_ops", "_nn", "_optim", "_data",
                   "_serialize"],
  };

  try {
    const borch = await import("/borch-ts/dist/src/index.js");
    await borch.init();
    globalThis.borch = borch;
    say(`어댑터: ${borch.Device.adapterInfo}`);

    const py = await loadPyodide({ indexURL: "/vendor/pyodide/" });
    await py.loadPackage("numpy");

    const grab = async (url) => {
      const res = await fetch(url);
      if (!res.ok) throw new Error(`파일을 못 받았다: ${url} (HTTP ${res.status})`);
      return res;
    };
    for (const pkg of Object.keys(PACKAGES)) {
      py.FS.mkdirTree(`/work/${pkg}`);
      for (const m of PACKAGES[pkg]) {
        py.FS.writeFile(`/work/${pkg}/${m}.py`,
          await (await grab(`/${pkg}/${m}.py`)).text());
      }
    }

    const code = await (await grab("/tests/browser/scope_escape_cases.py")).text();
    py.FS.writeFile("/work/cases.py", code);
    const report = await py.runPythonAsync(`
import sys
sys.path.insert(0, "/work")
import cases
cases.run()
`);
    window.__scopeEscape = { text: report, adapter: borch.Device.adapterInfo };
    say(report);
  } catch (err) {
    const detail = err && err.stack ? err.stack : String(err);
    window.__scopeEscape = { error: detail };
    say(`재지 못했다: ${detail}`);
  }
</script>
</body>
