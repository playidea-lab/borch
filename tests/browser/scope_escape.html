<!doctype html>
<meta charset="utf-8">
<title>Can a tensor be carried out of a scope</title>
<body>
<pre id="out">measuring…</pre>
<script src="/vendor/pyodide/pyodide.js"></script>
<script type="module">
  /*
   * The question: **can a tensor still be used after leaving `with torch.scope():` in Python.**
   *
   * borch.ts has both `keepAlive(t)` and `scope(body, () => [t])` and the binding had
   * neither, so a training loop could not even read its loss.
   *
   * And the two **are not the same.** `keepAlive` calls `Device.keep` and puts it in the
   * set no scope ever releases, while `endScope(keep)` hands it to the enclosing scope.
   * Bridging only one leaks or leaves it unusable — so the difference is measured here.
   */
  const out = document.getElementById("out");
  const lines = [];
  const say = (s) => { lines.push(s); out.textContent = lines.join("\n"); };

  const PACKAGES = {
    borch: ["__init__", "_base", "_tensor", "_ops", "_fft", "_nn", "_optim",
            "_data", "_rnn", "_serialize", "autograd"],
    borch_webgpu: ["__init__", "_base", "_ops", "_nn", "_optim", "_data",
                   "_serialize", "_onnx", "_hub", "_report", "autograd"],
  };

  try {
    const borch = await import("/borch-ts/dist/src/index.js");
    await borch.init();
    globalThis.borch = borch;
    say(`adapter: ${borch.Device.adapterInfo}`);

    const py = await loadPyodide({ indexURL: "/vendor/pyodide/" });
    await py.loadPackage("numpy");

    const grab = async (url) => {
      const res = await fetch(url);
      if (!res.ok) throw new Error(`could not fetch: ${url} (HTTP ${res.status})`);
      return res;
    };
    for (const pkg of Object.keys(PACKAGES)) {
      py.FS.mkdirTree(`/work/${pkg}`);
      for (const m of PACKAGES[pkg]) {
        py.FS.writeFile(`/work/${pkg}/${m}.py`,
          await (await grab(`/${pkg}/${m}.py`)).text());
      }
    }

    const code = await (await grab("/tests/browser/scope_escape_cases.py")).text();
    py.FS.writeFile("/work/cases.py", code);
    const report = await py.runPythonAsync(`
import sys
sys.path.insert(0, "/work")
import cases
cases.run()
`);
    const got = JSON.parse(report);   // {ok, text} — the verdict is data, not prose
    window.__scopeEscape = { ...got, adapter: borch.Device.adapterInfo };
    say(got.text);
  } catch (err) {
    const detail = err && err.stack ? err.stack : String(err);
    window.__scopeEscape = { error: detail };
    say(`could not measure: ${detail}`);
  }
</script>
</body>
