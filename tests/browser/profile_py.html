<!doctype html>
<meta charset="utf-8">
<title>a training step under GPU timestamps, on the wheel, in a worker</title>
<body>
<pre id="out">probing…</pre>
<script>
  // **The wheel alone, in a Web Worker** — JupyterLite's shape: Pyodide in a worker,
  // no page-side borch.ts, nothing but `pip install`. The worker installs numpy and the
  // wheel from this checkout, imports `borch_webgpu` (which boots its own borch.ts from
  // the bundle it carries), trains the U-Net of tests/seg_eval.py on synthetic data, times the step on the
  // wall, then runs it under the device's timestamp profiler and posts the time per kind of kernel. WebGPU in a worker is Chrome's; JSPI in a worker is what `run_sync` needs.
  const out = document.getElementById("out");
  const q = new URLSearchParams(location.search);
  const wheel = location.origin + q.get("wheel");
  // A worker made from a blob URL resolves paths against the blob, so every URL it
  // touches is spelled out with the page's origin.
  const origin = location.origin;
  const code = `
    importScripts(${JSON.stringify(origin + "/vendor/pyodide/pyodide.js")});
    (async () => {
      const t0 = performance.now();
      const say = (s) => postMessage({ say: s });
      try {
        const py = await loadPyodide({ indexURL: ${JSON.stringify(origin + "/vendor/pyodide/")} });
        say("Pyodide " + py.version + " in a worker · navigator.gpu " + (typeof navigator.gpu) + " · WebAssembly.Suspending " + (typeof WebAssembly.Suspending));
        await py.loadPackage("numpy");
        await py.loadPackage(${JSON.stringify(wheel)});
        say("installed the wheel · " + (performance.now() - t0).toFixed(0) + " ms so far");
        const t1 = performance.now();
        const text = await py.runPythonAsync(\`
import sys, time, types
import numpy as np
import js
from pyodide.ffi import run_sync
import borch_webgpu as torch
origin = ${JSON.stringify(origin)}
def get(path, binary=False):
    r = run_sync(js.fetch(origin + path))
    if not r.ok: raise RuntimeError(f"{r.status} {path}")
    return bytes(run_sync(r.arrayBuffer()).to_py()) if binary else str(run_sync(r.text()))
def module(name, path):
    mod = types.ModuleType(name); mod.__file__ = f"/tmp/{name}.py"
    exec(compile(get(path), f"{name}.py", "exec"), mod.__dict__); sys.modules[name] = mod
    return mod
module("review_eval", "/tests/review_eval.py")
S = module("seg_eval", "/tests/seg_eval.py")
import time
from pyodide.ffi import create_proxy
batch = ${parseInt(q.get("batch") || "16")}; side = ${parseInt(q.get("size") || "96")}; steps = ${parseInt(q.get("steps") || "5")}; COMPILED = ${JSON.stringify(q.get("compiled") || "")}
MODEL = ${JSON.stringify(q.get("model") || "unet")}
# Synthetic data: the profile is of the kernels, not of a dataset, and it has to run
# where no dataset is (the nightly's worktree).
rng = np.random.default_rng(0)
nn = torch.nn
if MODEL == "unet":
    x = rng.random((batch, 3, side, side), dtype=np.float32); m = (rng.random((batch, 1, side, side)) > 0.7).astype(np.float32)
    crit = nn.BCEWithLogitsLoss(); model = S.build_unet(torch); model.train(); opt = torch.optim.Adam(model.parameters(), lr=1e-3)
    xb, mb = torch.tensor(x), torch.tensor(m)
    label = f"unet {side}px batch {batch}"
elif MODEL == "resnet":
    # ResNet-18 for CIFAR (tests/resnet.py), 32 × 32, the batch as asked.
    R = module("resnet_recipe", "/tests/resnet.py")
    model, _images, _labels = R._build(torch); model.train()
    x = rng.random((batch, 3, 32, 32), dtype=np.float32); m = rng.integers(0, 10, batch).astype(np.int64)
    crit = nn.CrossEntropyLoss(); opt = torch.optim.SGD(model.parameters(), lr=0.05, momentum=0.9, weight_decay=1e-4)
    xb, mb = torch.tensor(x), torch.tensor(m)
    label = f"resnet18 cifar batch {batch}"
elif MODEL == "gpt":
    # A small decoder: two blocks of LayerNorm → attention → LayerNorm → GELU MLP, a
    # tied-off LM head — the kernels a transformer spends its time in.
    T, D, HEADS, VOCAB = ${parseInt(q.get("seq") || "128")}, ${parseInt(q.get("dim") || "256")}, 4, 1024
    class Block(nn.Module):
        def __init__(self):
            super().__init__()
            self.ln1 = nn.LayerNorm(D); self.attn = nn.MultiheadAttention(D, HEADS, batch_first=True)
            self.ln2 = nn.LayerNorm(D); self.fc1 = nn.Linear(D, 4 * D); self.fc2 = nn.Linear(4 * D, D)
        def forward(self, h, mask):
            a = self.ln1(h); h = h + self.attn(a, a, a, attn_mask=mask, need_weights=False)[0]
            return h + self.fc2(nn.functional.gelu(self.fc1(self.ln2(h))))
    class GPT(nn.Module):
        def __init__(self):
            super().__init__()
            self.emb = nn.Embedding(VOCAB, D); self.pos = nn.Embedding(T, D)
            self.blocks = nn.ModuleList([Block(), Block()]); self.ln = nn.LayerNorm(D); self.head = nn.Linear(D, VOCAB)
        def forward(self, idx, mask):
            h = self.emb(idx) + self.pos(torch.arange(T))
            for b in self.blocks: h = b(h, mask)
            return self.head(self.ln(h))
    model = GPT(); model.train(); crit = nn.CrossEntropyLoss(); opt = torch.optim.AdamW(model.parameters(), lr=3e-4)
    tokens = rng.integers(0, VOCAB, (batch, T + 1)).astype(np.int64)
    xb, mb = torch.tensor(tokens[:, :-1]), torch.tensor(tokens[:, 1:].reshape(-1))
    causal = torch.tensor(np.triu(np.full((T, T), -np.inf, np.float32), 1))
    label = f"gpt 2 blocks seq {T} dim {D} batch {batch}"
elif MODEL == "vit":
    # The hub's ViT-tiny (bimm, 5.7M parameters), fine-tuned at 224 px on the batch as
    # asked — the transformer the hub actually ships, not a toy.
    from borch_webgpu import hub
    model = hub.load("imagenet-vit-tiny-patch16-224", verify=False); model.train()
    x = rng.random((batch, 3, 224, 224), dtype=np.float32); m = rng.integers(0, 1000, batch).astype(np.int64)
    crit = nn.CrossEntropyLoss(); opt = torch.optim.SGD(model.parameters(), lr=0.01, momentum=0.9)
    xb, mb = torch.tensor(x), torch.tensor(m)
    label = f"vit-tiny 224px batch {batch}"
else:
    raise ValueError(f"model? {MODEL}")
if COMPILED:
    label += f" compiled {COMPILED}"
first = next(iter(model.parameters()))
def step():
    opt.zero_grad()
    out = model(xb, causal) if MODEL == "gpt" else model(xb)
    loss = crit(out.reshape(-1, out.shape[-1]) if MODEL == "gpt" else out, mb); loss.backward(); opt.step()
if COMPILED:
    # The same step through the compiler: "plain" replays the recording, "fused" runs
    # the fusion pass over it first. The first call records; the trials replay.
    step = torch.compiled(step, fuse=(COMPILED == "fused"))
def full():
    with torch.scope():
        step(); float(first.flatten()[0].item())
for _ in range(5): full()
trials = []
for _ in range(3):
    t0 = time.perf_counter()
    for _ in range(25): full()
    trials.append((time.perf_counter() - t0) / 25 * 1000)
d0 = torch.dispatches(); full(); per_step = torch.dispatches() - d0
dev = js.borch.device()
async def body():
    with torch.scope():
        for _ in range(steps): step()
        dev.flush(); await dev.synchronize()
run_sync(dev.profile(create_proxy(body)))
NAMES = {"cnd": "conv direct (fwd, dX)", "cnt": "conv GEMM fwd/dX", "cnwt": "conv GEMM weight grad", "cnwd": "conv direct weight grad", "cnwg": "conv subgroup weight grad", "smx": "softmax (rows)", "cf": "column fold", "smxb": "softmax bwd (rows)", "cnf": "conv subgroup fwd", "tmw": "tap-major weights", "pdw": "pad for weight grad", "sst": "tapped sums", "cnxt": "conv GEMM input grad", "ss": "split sums", "ssc": "split sums (conv)",
         "bns": "batchnorm stats", "bnf": "batchnorm finish", "bna": "batchnorm apply", "bnsb": "batchnorm stats bwd", "bnfb": "batchnorm finish bwd", "bnba": "batchnorm apply bwd", "rs": "running stats",
         "u": "unary", "ub": "unary bwd", "b": "binary", "bb": "binary bwd", "rb": "broadcast fold", "rbw": "broadcast fold (wide)", "rd": "reduce dim", "rsum": "reduce sum", "pn": "pool", "pnbt": "pool bwd (tiled max)", "pnb": "pool bwd",
         "catc": "cat copy", "gt": "gather (narrow)", "adam": "adam step", "sgd": "sgd step", "bcel": "bce loss", "bcelb": "bce loss bwd", "cturn": "turn weights", "mm": "matmul", "mmsg": "matmul (subgroup)", "pad": "pad"}
# The query set holds a fixed number of timestamps; past it dispatches run untimed and
# are counted in profileDropped. Dividing by steps would then show a fifth of a ViT
# step as the step — so the divisor is the number of steps actually timed. (No
# backticks in this Python: it sits inside a JS template literal.)
dropped = int(dev.profileDropped)
timed_steps = (per_step * steps - dropped) / per_step
per, count = {}, {}
for k, ns in dev.nsByKind.entries():
    kind = str(k).split(":")[0]; per[kind] = per.get(kind, 0) + float(ns) / 1e6 / timed_steps
for k, c in dev.countByKind.entries():
    kind = str(k).split(":")[0]; count[kind] = count.get(kind, 0) + int(c) / timed_steps
total = sum(per.values())
lines = [f"{label}: step {min(trials):.1f} ms wall (trials {' / '.join(f'{t:.1f}' for t in trials)}) · {per_step} dispatches · GPU {total:.1f} ms/step over {timed_steps:.2f} timed steps (dropped {dropped})"]
for kind, ms in sorted(per.items(), key=lambda kv: -kv[1]):
    if ms / total < 0.005: break
    lines.append(f"  {ms:5.2f} ms  {ms / total:4.0%}  {count.get(kind, 0):5.0f}×  {NAMES.get(kind, kind)} [{kind}]")
# The products one by one — the full key names M:K:N and the transposes — since one
# kind can hide a few slow shapes among many fast ones.
detail = {}
for k, ns in dev.nsByKind.entries():
    key = str(k)
    if key.split(":")[0] in ("mmsg", "mm", "bmm", "bmmsg", "sumsplits"):
        detail[key] = (detail.get(key, (0, 0))[0] + float(ns) / 1e6 / timed_steps, detail.get(key, (0, 0))[1] + int(dev.countByKind.get(k) or 0) / timed_steps)
for key, (ms, c) in sorted(detail.items(), key=lambda kv: -kv[1][0])[:12]:
    lines.append(f"    {ms:5.2f} ms  {c:4.0f}×  {ms / c * 1000 if c else 0:5.0f} us each  {key}")
adapter = str(js.borch.Device.adapterInfo)
chr(10).join(lines) + chr(10) + f"faults {int(dev.faults.count)} · adapter {adapter}"
\`);
        postMessage({ done: text, ms: performance.now() - t1 });
      } catch (err) {
        postMessage({ error: String(err && err.stack || err) });
      }
    })();
  `;
  const worker = new Worker(URL.createObjectURL(new Blob([code], { type: "text/javascript" })));
  const lines = [];
  const show = () => { out.textContent = lines.join("\n"); };
  worker.onmessage = (e) => {
    if (e.data.say) { lines.push(e.data.say); show(); }
    // The worker is ended once it has answered: left alive with its device up, the
    // browser context would not close and the probe hung after every run (measured).
    if (e.data.done) { lines.push(e.data.done + " · the run " + e.data.ms.toFixed(0) + " ms"); show(); window.__wheel = { text: lines.join("\n"), done: e.data.done }; worker.terminate(); }
    if (e.data.error) { lines.push("error: " + e.data.error); show(); window.__wheel = { text: lines.join("\n"), ok: false, error: e.data.error }; worker.terminate(); }
  };
  worker.onerror = (e) => { lines.push("worker error: " + (e.message || e)); show(); window.__wheel = { text: lines.join("\n"), ok: false, error: String(e.message || e) }; };
</script>
</body>
