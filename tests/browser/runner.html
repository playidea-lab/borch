<!DOCTYPE html>
<meta charset="utf-8">
<title>borch — 골든 대조</title>
<!-- 빈 favicon. 없으면 매 실행마다 404 가 콘솔에 찍혀 진짜 오류를 덮는다. -->
<link rel="icon" href="data:,">

<!--
  골든 2단계. 브라우저 안에서 라이브러리를 골든과 대조한다.

  저장소 **루트를 서빙한 채** 로 열어야 한다(`/tests/browser/runner.html`).
  아래 경로들이 거기에 맞춰져 있고, 가상 파일시스템에도 같은 모양으로 얹는다 —
  그래야 golden.py 의 `__file__` 기준 경로 계산을 안 고쳐도 된다.

  대조할 라이브러리는 `?lib=` 로 고른다. 기본은 borch 이고,
  GPU 백엔드가 생기면 `?lib=borch_webgpu` 로 바꾼다 — 이 파일은 안 고친다.
-->

<pre id="out">시작하는 중…</pre>

<!-- 이 페이지는 Pyodide 를 서빙한다 = 실행 형태로 배포한다. MPL-2.0 §3.2 가 소스를
     구할 길을 알리라고 하므로, 문서에만 적어두지 않고 페이지에 둔다. -->
<footer style="margin-top:2rem;font:12px/1.6 system-ui;color:#666">
  이 페이지는 <a href="https://github.com/pyodide/pyodide">Pyodide</a>(MPL-2.0)와
  <a href="https://github.com/tensorflow/tfjs">TensorFlow.js</a>(Apache-2.0)를 포함합니다.
  각 소스는 링크된 저장소에서 받을 수 있습니다.
  numpy(BSD-3-Clause)와 CPython 표준 라이브러리(PSF)도 함께 실립니다 —
  <a href="/THIRD-PARTY.md">THIRD-PARTY.md</a>.
</footer>

<!-- 전부 로컬에서 온다. CDN 은 테스트 시점에 살아 있어야 하는 의존이었고 실제로
     한 번 끊겼다 — `tests/browser/vendor.py` 가 받아 두고 해시로 잠근다. -->
<script src="/vendor/pyodide/pyodide.js"></script>
<script>
const OUT = document.getElementById("out");
const say = (line) => { OUT.textContent += "\n" + line; };

// 드라이버(run.py)가 읽는 자리. 끝나기 전에는 null 이다.
window.GOLDEN_RESULT = null;

// 저장소 안의 경로 → Pyodide 가상 파일시스템의 경로.
// 오른쪽 모양을 왼쪽과 같게 두는 것이 요점이다.
//
// 두 라이브러리는 **패키지다**(예전에는 파일 하나였다). 모듈을 여기 적어야 한다 —
// 빠뜨리면 `ImportError` 로 시끄럽게 터진다. 조용히 반쪽만 실리는 것보다 낫다.
const PACKAGES = {
  borch: ["__init__", "_base", "_tensor", "_ops", "_nn", "_optim", "_data", "_rnn"],
  borch_webgpu: ["__init__", "_base", "_tensor", "_ops", "_functional",
                        "_nn", "_optim", "_data"],
  // borch.ts 위에 얹은 얇은 결속. TF.js 대신 우리 WGSL 이 돈다.
  borch_ts: ["__init__", "_base", "_ops", "_nn", "_optim", "_install_probe"],
};
const FILES = [
  ["/borch_vision.py", "/work/borch_vision.py"],
  ["/tests/cases.py", "/work/tests/cases.py"],
  ["/tests/golden.py", "/work/tests/golden.py"],
  ["/tests/browser/bench.py", "/work/bench.py"],
];
for (const [pkg, mods] of Object.entries(PACKAGES)) {
  for (const m of mods) FILES.push([`/${pkg}/${m}.py`, `/work/${pkg}/${m}.py`]);
}
const BINARY = [["/tests/golden.npz", "/work/tests/golden.npz"]];
// 뽑아둔 JSON 도 같이 싣는다 — 브라우저에서 그것만으로 대조가 되는지 확인할 수
// 있어야 "다른 언어도 쓸 수 있다"가 주장이 아니라 실측이 된다.
FILES.push(["/tests/golden.json", "/work/tests/golden.json"]);
FILES.push(["/tests/export_json.py", "/work/tests/export_json.py"]);

// TF.js 는 GPU 경로에서만 필요하다. 코어 borch 는 numpy 뿐이라 안 부른다.
const TFJS = ["/vendor/tf.min.js", "/vendor/tf-backend-webgpu.min.js"];

function loadScript(src) {
  return new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = src;
    s.onload = () => res(src);
    s.onerror = () => rej(new Error("스크립트를 못 받았다: " + src));
    document.head.appendChild(s);
  });
}

async function startTfjs() {
  for (const src of TFJS) await loadScript(src);
  await tf.setBackend("webgpu");
  await tf.ready();
  if (tf.getBackend() !== "webgpu") {
    throw new Error("WebGPU 백엔드가 안 붙었다 — 지금 백엔드: " + tf.getBackend());
  }
  return tf.getBackend();
}

async function main() {
  const lib = new URLSearchParams(location.search).get("lib") || "borch";
  OUT.textContent = "Pyodide 를 올리는 중…";
  const py = await loadPyodide({ indexURL: "/vendor/pyodide/" });
  // 대조가 끝난 뒤 드라이버가 임의의 파이썬을 물어볼 수 있게 남겨둔다.
  // 브라우저 안에서만 재현되는 것을 눈으로 보려면 이 통로가 있어야 한다.
  window.PY = py;
  say("numpy 를 올리는 중…");
  await py.loadPackage("numpy");

  py.FS.mkdirTree("/work/tests");
  for (const pkg of Object.keys(PACKAGES)) py.FS.mkdirTree(`/work/${pkg}`);
  // `fetch` 는 404 에 예외를 안 던진다. 확인 안 하면 **오류 페이지의 HTML 이 그대로
  // 파이썬 파일로 써진다** — 실제로 그렇게 해서 `<!DOCTYPE HTML>` 에서 SyntaxError 가
  // 났다. 없는 파일은 없다고 말해야 한다.
  const grab = async (url) => {
    const res = await fetch(url);
    if (!res.ok) throw new Error(`파일을 못 받았다: ${url} (HTTP ${res.status})`);
    return res;
  };
  for (const [url, dst] of FILES) {
    py.FS.writeFile(dst, await (await grab(url)).text());
  }
  for (const [url, dst] of BINARY) {
    py.FS.writeFile(dst, new Uint8Array(await (await grab(url)).arrayBuffer()));
  }
  say(`대조 대상: ${lib}`);
  let backend = "numpy (브라우저 GPU 안 씀)";
  if (lib === "borch_ts") {
    // borch.ts 는 TF.js 를 안 쓴다. 대신 ES 모듈을 올리고 어댑터를 잡은 뒤
    // 전역에 둔다 — 파이썬 결속이 `js.borch` 로 그것을 잡는다.
    say("borch.ts 를 올리는 중…");
    const borch = await import("/borch-ts/dist/src/index.js");
    await borch.init();
    globalThis.borch = borch;
    backend = `borch.ts — ${borch.Device.adapterInfo}`;
    say(backend);
  } else if (lib !== "borch") {
    say("TF.js 를 올리는 중…");
    backend = await startTfjs();
    say(`TF.js 백엔드: ${backend}`);
  }

  const code = `
import importlib, importlib.util, json, sys

if "/work" not in sys.path:
    sys.path.insert(0, "/work")

_spec = importlib.util.spec_from_file_location("bt_golden", "/work/tests/golden.py")
g = importlib.util.module_from_spec(_spec)
_spec.loader.exec_module(g)

LIB = ${JSON.stringify(lib)}
lib = g.load_borch() if LIB == "borch" else importlib.import_module(LIB)

bad, total = g.check(lib, "/work/tests/golden.npz")
json.dumps({"lib": LIB, "total": total, "bad": bad})
`;
  const result = JSON.parse(await py.runPythonAsync(code));
  const ok = result.bad.length === 0;
  say(`\n골든 대조 — 케이스 ${result.total}개`);
  say(`  일치 ${result.total - result.bad.length}/${result.total}`);
  for (const why of result.bad) say(`  ✗ ${why}`);
  window.GOLDEN_RESULT = { ...result, ok, backend };
}

main().catch((e) => {
  // 파이썬 쪽 예외는 메시지 안에 역추적이 통째로 들어 있다. 자르면 원인이 사라진다.
  const detail = (e && e.message ? e.message : String(e));
  say("\n실패:\n" + detail);
  console.error("[runner] " + detail);
  // 실패도 결과다. 드라이버가 영원히 기다리지 않게 남긴다.
  window.GOLDEN_RESULT = { ok: false, total: 0, bad: ["러너가 터졌다"], error: detail };
});
</script>
