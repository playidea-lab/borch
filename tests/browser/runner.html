<title>borch — golden comparison</title>
<!-- An empty favicon. Without it a 404 is printed to the console every run and buries real errors. -->
<link rel="icon" href="data:,">

<!--
  Golden stage two. Compares a library against the golden answers inside a browser.

  It has to be opened **with the repository root served** (`/tests/browser/runner.html`).
  The paths below are set to that, and the virtual filesystem gets the same shape — so
  golden.py's `__file__`-relative path arithmetic needs no editing.

  The library to compare is picked with `?lib=`. The default is borch, and with a GPU
  backend it becomes `?lib=borch_webgpu` — this file is not edited.
-->

<pre id="out">starting…</pre>

<!-- This page serves Pyodide = distributes it in executable form. MPL-2.0 §3.2 asks that the
     way to obtain the source be given, so it goes on the page rather than in a document only. -->
<footer style="margin-top:2rem;font:12px/1.6 system-ui;color:#666">
  This page includes <a href="https://github.com/pyodide/pyodide">Pyodide</a> (MPL-2.0) and
  <a href="https://github.com/tensorflow/tfjs">TensorFlow.js</a> (Apache-2.0).
  The source of each can be obtained from the linked repository.
  numpy (BSD-3-Clause) and the CPython standard library (PSF) load alongside them —
  <a href="/THIRD-PARTY.md">THIRD-PARTY.md</a>.
</footer>

<!-- All of it comes from local files. A CDN was a dependency that had to be alive at test time
     and it really did go down once — `tests/browser/vendor.py` fetches it and locks it by hash. -->
<script src="/vendor/pyodide/pyodide.js"></script>
<script>
const OUT = document.getElementById("out");
const say = (line) => { OUT.textContent += "\n" + line; };

// What the driver (run.py) reads. It is null until this finishes.
window.GOLDEN_RESULT = null;

// A path in the repository → a path in Pyodide's virtual filesystem.
// Keeping the right-hand shape the same as the left-hand one is the point.
//
// Both libraries are **packages** (they used to be one file each). The modules have to be
// listed here — a missing one blows up loudly as an `ImportError`, which beats half of it
// loading quietly.
const PACKAGES = {
  borch: ["__init__", "_base", "_tensor", "_ops", "_fft", "_nn", "_optim",
          "_data", "_rnn", "_serialize", "autograd"],
  // The thin binding over borch.ts. This name used to be the TF.js edition.
  borch_webgpu: ["__init__", "_base", "_ops", "_nn", "_optim", "_data",
                 "_serialize", "_onnx", "_hub", "autograd"],
};
const FILES = [
  ["/borchvision.py", "/work/borchvision.py"],
  ["/tests/cases.py", "/work/tests/cases.py"],
  ["/tests/golden.py", "/work/tests/golden.py"],
  ["/tests/browser/bench.py", "/work/bench.py"],
  // The benchmark's pair — that one times, this one counts. Called by `--cost`.
  ["/tests/browser/cost.py", "/work/cost.py"],
  // The training comparison, called by `--resnet`. **The same file the native run uses**
  // — it takes the library rather than importing one, so the browser asks the identical
  // thirty steps rather than a second copy of them that could drift.
  ["/tests/resnet.py", "/work/tests/resnet.py"],
];
for (const [pkg, mods] of Object.entries(PACKAGES)) {
  for (const m of mods) FILES.push([`/${pkg}/${m}.py`, `/work/${pkg}/${m}.py`]);
}
const BINARY = [["/tests/golden.npz", "/work/tests/golden.npz"]];
// The exported JSON loads too — being able to confirm in a browser that it alone suffices for
// a comparison is what turns "another language could use this" from a claim into a measurement.
FILES.push(["/tests/golden.json", "/work/tests/golden.json"]);
FILES.push(["/tests/export_json.py", "/work/tests/export_json.py"]);

// **This is where TF.js used to load.** There were some twenty lines putting
// `vendor/tf.min.js` in a script tag and confirming `tf.setBackend("webgpu")` really attached.
// That implementation is gone, so neither the vendor files nor this runner call it — the only
// thing this page fetches from outside now is Pyodide.

async function main() {
  const lib = new URLSearchParams(location.search).get("lib") || "borch";
  OUT.textContent = "loading Pyodide…";
  const py = await loadPyodide({ indexURL: "/vendor/pyodide/" });
  // Left here so the driver can ask arbitrary Python after the comparison finishes.
  // Seeing what only reproduces inside the browser needs this channel.
  window.PY = py;
  say("loading numpy…");
  await py.loadPackage("numpy");

  py.FS.mkdirTree("/work/tests");
  for (const pkg of Object.keys(PACKAGES)) py.FS.mkdirTree(`/work/${pkg}`);
  // `fetch` throws nothing on a 404. Unchecked, **the error page's HTML gets written out as a
  // Python file** — that really happened and gave a SyntaxError on `<!DOCTYPE HTML>`. A file
  // that is not there has to say so.
  const grab = async (url) => {
    const res = await fetch(url);
    if (!res.ok) throw new Error(`could not fetch: ${url} (HTTP ${res.status})`);
    return res;
  };
  for (const [url, dst] of FILES) {
    py.FS.writeFile(dst, await (await grab(url)).text());
  }
  for (const [url, dst] of BINARY) {
    py.FS.writeFile(dst, new Uint8Array(await (await grab(url)).arrayBuffer()));
  }
  say(`comparing: ${lib}`);
  let backend = "numpy (no browser GPU)";
  if (lib !== "borch") {
    // Loads the ES module, gets the adapter and puts it in the global — the Python binding
    // reaches it as `js.borch`. **The TF.js branch is gone** — that implementation was deleted.
    say("loading borch.ts…");
    const borch = await import("/borch-ts/dist/src/index.js");
    await borch.init();
    globalThis.borch = borch;
    backend = `borch.ts — ${borch.Device.adapterInfo}`;
    say(backend);
  }

  const code = `
import importlib, importlib.util, json, sys

if "/work" not in sys.path:
    sys.path.insert(0, "/work")

_spec = importlib.util.spec_from_file_location("bt_golden", "/work/tests/golden.py")
g = importlib.util.module_from_spec(_spec)
_spec.loader.exec_module(g)

LIB = ${JSON.stringify(lib)}
lib = g.load_borch() if LIB == "borch" else importlib.import_module(LIB)

# **The GPU validation error count is read per case.** WebGPU does not throw one as an
# exception and quietly discards the command buffer, so unmeasured **the culprit passes and a
# case queued behind it turns red instead.** That happened three times. The core (numpy) has
# nothing to measure.
faults = None
if LIB != "borch":
    import js
    # **Device.faults belongs to the instance** — unlike adapterInfo it is not static, so the
    # currently attached device has to be reached through device().
    #
    # **Do not use a backtick in here.** This Python sits inside a JS template string, so one
    # backtick closes the string and the whole script dies in parsing — the symptom is not a
    # console error but GOLDEN_RESULT being undefined, which the driver reads as "no result".
    # That is a very long way from the cause.
    faults = lambda: int(js.borch.device().faults.count)         # noqa: E731

bad, total = g.check(lib, "/work/tests/golden.npz", faults=faults)
json.dumps({"lib": LIB, "total": total, "bad": bad,
            "faults": faults() if faults else 0})
`;
  const result = JSON.parse(await py.runPythonAsync(code));
  const ok = result.bad.length === 0;
  say(`\ngolden comparison — ${result.total} cases`);
  say(`  agreeing ${result.total - result.bad.length}/${result.total}`);
  if (result.faults) say(`  ${result.faults} GPU validation errors — the green above is that much less trustworthy`);
  for (const why of result.bad) say(`  ✗ ${why}`);
  window.GOLDEN_RESULT = { ...result, ok, backend };
}

main().catch((e) => {
  // A Python exception carries the whole traceback inside its message. Trimming loses the cause.
  const detail = (e && e.message ? e.message : String(e));
  say("\nfailed:\n" + detail);
  console.error("[runner] " + detail);
  // A failure is a result too. Left here so the driver does not wait forever.
  window.GOLDEN_RESULT = { ok: false, total: 0, bad: ["the runner blew up"], error: detail };
});
</script>
