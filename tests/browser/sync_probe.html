<!doctype html>
<meta charset="utf-8">
<title>Can borch.ts be called synchronously from Pyodide</title>
<body>
<pre id="out">measuring…</pre>
<script src="/vendor/pyodide/pyodide.js"></script>
<script type="module">
  /*
   * One question: **can borch.ts's asynchronous readback be called synchronously from
   * Pyodide's Python?**
   *
   * Why this is the fork. The sister library's (`borch_webgpu`) Python API is synchronous
   * throughout — because TF.js's `dataSync()` accepts it even though WebGPU has no synchronous
   * readback API. borch.ts is `await stage.mapAsync(...)`, asynchronous, and laid on as it is
   * that turns `loss.item()` into `await loss.item()`. Which breaks this project's one claim:
   * "run the tutorial code with only the import changed."
   *
   * So the answer forks. If it works the sister library can move onto borch.ts; if not, that
   * road ends here. **Measured rather than guessed.**
   */
  const out = document.getElementById("out");
  const lines = [];
  const say = (s) => { lines.push(s); out.textContent = lines.join("\n"); };

  try {
    const borch = await import("/borch-ts/dist/src/index.js");
    await borch.init();
    // Put in the global so Pyodide's Python can reach it through `import js`.
    globalThis.borch = borch;
    say(`adapter: ${borch.Device.adapterInfo}`);

    const py = await loadPyodide({ indexURL: "/vendor/pyodide/" });
    say(`Pyodide ${py.version}`);

    // 1) Is JSPI in this browser? `run_sync` stands on it.
    const jspi = typeof WebAssembly.Suspending === "function";
    say(`WebAssembly JSPI: ${jspi ? "present" : "absent"}`);

    // 2) Is run_sync there on the Python side?
    const hasRunSync = py.runPython(`
import pyodide.ffi
hasattr(pyodide.ffi, "run_sync")
`);
    say(`pyodide.ffi.run_sync: ${hasRunSync ? "present" : "absent"}`);

    // 3) **Does it actually work?** Being present and running are different things.
    //
    // The entry point matters. Entering through `runPython` (a synchronous entry) leaves no
    // suspension point on the stack, so `run_sync` fails structurally ("No suspender") — the
    // first measurement went that way and nearly read as "it does not work". **That is not the
    // real scenario.** The page enters asynchronously (`runPythonAsync`) and the user code
    // running inside it is synchronous. torch code has exactly that shape.
    const BODY = `
import js
from pyodide.ffi import run_sync

def user_code():
    """**This is the code a user writes.** There must not be a single await."""
    t = js.borch.Tensor.from_(js.Float32Array.new([1.0, 2.0, 3.0]), js.Array.of(3))
    doubled = t.mul(js.borch.Tensor.full(js.Array.new(), 2.0))
    return list(run_sync(doubled.toArray()))

user_code()
`;
    let verdict = null;
    try {
      verdict = py.runPython(BODY);
      say(`synchronous readback (sync entry): ${JSON.stringify(Array.from(verdict))} — works`);
    } catch (err) {
      // **Not trimmed.** The first two lines are the shell of a Python traceback and the real
      // reason is at the bottom — trimming it led one diagnosis astray already.
      say(`synchronous readback (sync entry): does not work — ${String(err).trim().split("\n").pop()}`);
    }
    let deep = null;
    try {
      deep = await py.runPythonAsync(BODY);
      say(`synchronous readback (async entry): ${JSON.stringify(Array.from(deep))} — **works**`);
    } catch (err) {
      say(`synchronous readback (async entry): does not work\n${String(err)}`);
    }
    verdict = deep ?? verdict;

    // 4) The control. Asynchronously it has to work — if it does not, the failure above is
    //    down to something other than synchrony.
    let async_ok = false;
    try {
      const got = await py.runPythonAsync(`
import js
t = js.borch.Tensor.from_(js.Float32Array.new([1.0, 2.0, 3.0]), js.Array.of(3))
got = await t.toArray()
list(got)
`);
      async_ok = true;
      say(`asynchronous readback (control): ${JSON.stringify(Array.from(got))} — works`);
    } catch (err) {
      say(`asynchronous readback (control): **does not work**\n${String(err)}`);
    }

    window.__syncProbe = {
      adapter: borch.Device.adapterInfo,
      jspi, hasRunSync,
      sync: verdict !== null && verdict !== undefined,
      async: async_ok,
      text: lines.join("\n"),
    };
  } catch (err) {
    window.__syncProbe = { error: String(err && err.stack ? err.stack : err) };
    say(`could not measure: ${err && err.stack ? err.stack : err}`);
  }
</script>
</body>
