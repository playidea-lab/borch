[project]
# **The distribution name and the import name are different things.** What is written
# here is the name `pip install` takes, and the name code calls is `borch` from
# `packages` below — the same arrangement as `pillow`→`PIL`, `beautifulsoup4`→`bs4`.
#
# `borch` is not available. That name on PyPI **belongs to somebody else**
# (Desupervised, "Probabilistic programming using pytorch", 0.1.6) and the domain
# happens to be adjacent. So there is no way to bring somebody who typed `pip install
# borch` here, and the two can only be told apart in the documentation.
#
# On npm `borch` was free, so it is used as is. The names differing between the two
# places is that circumstance, not a design.
name = "pyborch"
version = "1.4.0"
description = "A thin PyTorch-shaped layer on numpy — practise the syntax in the browser with nothing installed"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]
license = { text = "Apache-2.0" }

[project.optional-dependencies]
# Real torch is needed for the comparison checks alone. Using it needs numpy only.
#
# **torchvision has been needed here since the vision cases landed and was not
# written down.** `tests/cases.py` imports it to freeze the golden answers, and
# `tests/torch_gap.py` now counts `transforms` against it — so the dump and the gap
# report both stopped without it while the list said torch alone was enough. An
# undeclared dependency is the same failure as a namespace off the list: it works on
# the machine that happens to have it.
#
# **`scipy` is a test authority and never a library one.** `tests/test_svhn.py` checks
# the `.mat` reader against `scipy.io` — having written the reader so the library needs
# no such package is the whole point, and checking it against the package that defines
# the format is how that reader earns the right to exist. It was undeclared for the same
# reason `torchvision` was, and cost more: an undeclared package that a file
# `importorskip`s does not fail, it **skips 19 tests and reports passed.**
dev = ["pytest", "torch", "torchvision", "scipy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `borch` became a package (it used to be a single file). Past three thousand lines
# the "one file, so it reads" justification went first — the reason is in the README.
#
# `borchvision` goes in too. Left out, somebody installing from the wheel has **no
# module at all** — the kind that works from the repository and not from the install,
# which nobody watches and only a user meets.
#
# **And it is still one file at 5,624 lines, which is past the threshold the paragraph
# above sets. That is a decision and not an oversight, so here is the reason.**
#
# The two are not loaded the same way. `borch` is a package and the playground fetches
# it **module by module** from a hardcoded list in `site/assets/runner.js` — the list
# exists, so `tests/test_site.py` can compare it against the directory and cry when the
# two part. `borchvision.py` is fetched in **one request** beside that loop, because one
# file needs no list.
#
# Splitting it buys readability and pays for it in the loading path: a second hardcoded
# list, a directory to create in Pyodide's filesystem, and N requests where a partial
# failure leaves a **half-imported package** rather than an absent module. The check that
# would catch a name dropped from that list is the one that already exists for `borch`,
# so it is writable — but the cost is paid on every playground load and the benefit is
# paid to whoever next reads the file.
#
# So it stays one file **until the loading path stops being the reason** — if the
# playground ever ships the wheel instead of fetching sources, this paragraph is spent
# and the split is simply overdue.
# `borch_webgpu` is not here. It is browser-only, and the borch.ts underneath it is
# loaded by the page as an ES module (`borch` on npm).
packages = ["borch"]
only-include = ["borch", "borchvision.py"]

[tool.hatch.build]
include = ["borch", "borchvision.py"]
