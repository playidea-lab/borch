[project]
name = "browsertorch"
version = "1.3.0"
description = "numpy 위에 얹은 PyTorch 모양의 얇은 층 — 설치 없이 브라우저에서 문법 연습"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]
license = { text = "Apache-2.0" }

[project.optional-dependencies]
# 진짜 torch 는 대조 검사에만 필요하다. 쓰는 쪽은 numpy 만 있으면 된다.
dev = ["pytest", "torch"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = []
only-include = ["browsertorch.py"]

[tool.hatch.build]
include = ["browsertorch.py"]
