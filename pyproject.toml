[project]
name = "browsertorch"
version = "1.4.0"
description = "numpy 위에 얹은 PyTorch 모양의 얇은 층 — 설치 없이 브라우저에서 문법 연습"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]
license = { text = "Apache-2.0" }

[project.optional-dependencies]
# 진짜 torch 는 대조 검사에만 필요하다. 쓰는 쪽은 numpy 만 있으면 된다.
dev = ["pytest", "torch"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `browsertorch` 는 패키지가 되었다(예전에는 파일 하나였다). 3천 줄이 넘어가면서
# "한 파일이라 읽힌다"는 명분이 먼저 없어졌다 — 이유는 README 에 적었다.
#
# `browsertorch_vision` 도 넣는다. 안 넣으면 휠로 설치한 사람에게는 **모듈이 아예
# 없다** — 저장소에서는 되고 설치본에서는 안 되는, 아무도 안 보다가 사용자만 만나는 종류다.
# `browsertorch_webgpu` 는 여기 없다. 브라우저 전용이고 TF.js 를 페이지가 싣는다.
packages = ["browsertorch"]
only-include = ["browsertorch", "browsertorch_vision.py"]

[tool.hatch.build]
include = ["browsertorch", "browsertorch_vision.py"]
